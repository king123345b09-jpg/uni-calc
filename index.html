<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magma Typing 🌋 | اختبار سرعة الكتابة البركاني العالمي</title>
    <!-- ربط ملف التنسيق الناري الخارجي بشكل سليم -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Magma Typing 🌋</h1>
        <p>منصة قياس وتطوير سرعة الكتابة العالمية لمختلف المستخدمين</p>
    </header>

    <div class="controls">
        <button id="magmaToggle" onclick="toggleMagmaMode()">طور ماغما (نجاة 95%) 💀</button>
        <select id="typeSelect" onchange="resetChallenge()">
            <option value="words">📝 كلمات عشوائية</option>
            <option value="paragraphs">📖 فقرات كاملة</option>
        </select>
        <select id="timeSelect" onchange="resetChallenge()">
            <option value="30">30 ثانية</option>
            <option value="60">1 دقيقة</option>
            <option value="120">2 دقيقة</option>
        </select>
        <button onclick="resetChallenge()">إعادة 🔄</button>
    </div>

    <!-- صندوق الكلمات المضاء والمميز جداً -->
    <div class="typing-box" id="textContainer"></div>

    <input type="text" class="input-field" id="wordInput" placeholder="ابدأ الكتابة هنا مباشرة لإنقاذ نفسك من الحمم..." autofocus autocomplete="off">

    <div class="results-panel">
        <div class="stat-box">
            <h4>السرعة (WPM)</h4>
            <div id="wpmValue">0</div>
        </div>
        <div class="stat-box">
            <h4>نسبة الدقة</h4>
            <div id="accuracyValue">100%</div>
        </div>
        <div class="stat-box">
            <h4>الوقت المتبقي</h4>
            <div id="timerValue">30ث</div>
        </div>
        <div class="stat-box">
            <h4>الأخطاء</h4>
            <div id="errorsValue">0</div>
        </div>
    </div>

    <footer>صُنع بكل شغف بواسطة المطور هيثم ومنصة الكاشا 💻</footer>
</div>

<!-- شاشة الموت والدم عند الخسارة في طور ماغما للجميع -->
<div class="blood-screen" id="gameOverScreen">
    <div class="blood-emojis">🩸💥💀💥🩸</div>
    <h2>احترقت في الماغما!</h2>
    <p style="font-size: 1.5rem; font-weight: bold; color: #fff;">لقد نزلت دقة كتابتك عن 95% ومُت في التحدي البركاني!</p>
    <button onclick="closeGameOver()" style="margin-top:20px; background:#000; border-color:#fff; color:#fff; cursor:pointer;">حاول مجدداً بروح قتالية 🔄</button>
</div>

<!-- ربط ملف الجافا سكريبت الخارجي -->
<script src="script.js"></script>
</body>
</html>
