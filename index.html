<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التحفيز والدراسة الذكية</title>
    <!-- خط تجوال العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #131b2e;
            --primary-gold: #ffd700;
            --gold-hover: #ffae00;
            --accent-blue: #0052cc;
            --deep-blue: #021535;
            --text-light: #f0f4f8;
            --text-muted: #a0aec0;
            --border-glow: rgba(255, 215, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* خلفية ديناميكية مع تأثيرات تنفس */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 82, 204, 0.15) 0%, rgba(10, 14, 23, 0.95) 70%);
            z-index: -1;
            animation: pulseBg 8s infinite alternate ease-in-out;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* تصميم الحاويات والشاشات التفاعلية */
        .step-card {
            background: var(--bg-card);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px var(--border-glow);
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
            animation: fadeInTransition 0.8s ease-out forwards;
        }

        /* تفاعل الحواف المضيئة عند مرور الفأرة */
        .interactive-hover {
            position: relative;
            overflow: hidden;
        }

        .interactive-hover:hover {
            border-color: var(--primary-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            transform: translateY(-4px);
        }

        /* الشاشة الكبيرة للمستخدم الذكي (المتحدث) */
        .avatar-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-gold), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--primary-gold);
            animation: avatarBreath 3s infinite ease-in-out;
        }

        @keyframes avatarBreath {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px var(--primary-gold); }
            50% { transform: scale(1.1); box-shadow: 0 0 30px var(--primary-gold), 0 0 10px #fff; }
        }

        .avatar-box i {
            font-size: 40px;
            color: var(--bg-dark);
        }

        h2 {
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        p {
            color: var(--text-light);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            background: var(--deep-blue);
            border: 1px solid var(--accent-blue);
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-gold), var(--gold-hover));
            color: var(--bg-dark);
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--accent-blue);
            color: var(--text-light);
        }

        .btn-secondary:hover {
            background: var(--accent-blue);
            color: #fff;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        /* واجهة الموقع الرئيسية */
        #mainDashboard {
            display: none;
            width: 95%;
            max-width: 1000px;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--bg-card);
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
        }

        .user-info h3 {
            color: var(--primary-gold);
            font-size: 1.4rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        /* قسم المؤقت */
        .timer-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary-gold);
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            font-family: monospace;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* شريط التقدم والأهداف */
        .goals-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            background: var(--deep-blue);
            height: 22px;
            border-radius: 11px;
            overflow: hidden;
            border: 1px solid var(--accent-blue);
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--primary-gold));
            box-shadow: 0 0 12px var(--primary-gold);
            transition: width 0.5s ease;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
        }

        .goals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .goals-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .goal-item {
            background: var(--deep-blue);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }

        .goal-item.completed {
            border-color: var(--primary-gold);
            opacity: 0.7;
        }

        .goal-item.completed span {
            text-decoration: line-through;
        }

        .goal-actions i {
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.1rem;
        }

        .goal-actions i.fa-check { color: var(--primary-gold); }
        .goal-actions i.fa-trash { color: #e74c3c; }

        /* نافذة إضافة هدف */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--primary-gold);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
        }

        /* حركات الانتقال */
        @keyframes fadeInTransition {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <!-- الخطوة 1: الاسم -->
    <div id="step1" class="step-card interactive-hover">
        <div class="avatar-box"><i class="fa-solid fa-robot"></i></div>
        <h2>مرحباً بك في عالم التميز!</h2>
        <p>أنا مرشدك الدراسي، يسعدني التعرف عليك. ما هو اسمك؟</p>
        <input type="text" id="userNameInput" placeholder="أدخل اسمك هنا..." autocomplete="off">
        <button class="btn" onclick="goToStep2()">المتابعة <i class="fa-solid fa-arrow-left"></i></button>
    </div>

    <!-- الخطوة 2: المستوى الدراسي -->
    <div id="step2" class="step-card interactive-hover" style="display: none;">
        <div class="avatar-box"><i class="fa-solid fa-graduation-cap"></i></div>
        <h2 id="welcomeUserText">أهلاً بك!</h2>
        <p>في أي مستوى دراسي تدرس حالياً؟</p>
        <select id="levelSelect">
            <option value="الإبتدائي">المستوى الابتدائي</option>
            <option value="المتوسط">المستوى المتوسط</option>
            <option value="الثانوي">المستوى الثانوي</option>
            <option value="الجامعة">المرحلة الجامعية</option>
        </select>
        <button class="btn" onclick="goToStep3()">التالي <i class="fa-solid fa-arrow-left"></i></button>
    </div>

    <!-- الخطوة 3: النصيحة حسب المستوى -->
    <div id="step3" class="step-card interactive-hover" style="display: none;">
        <div class="avatar-box"><i class="fa-solid fa-lightbulb"></i></div>
        <h2>نصيحتك الذهبية اليوم</h2>
        <p id="adviceText">جاري تحضير النصيحة...</p>
        <button class="btn" onclick="startMainApp()">ابدأ الرحلة الآن <i class="fa-solid fa-rocket"></i></button>
    </div>

    <!-- واجهة الموقع الرئيسية -->
    <div id="mainDashboard">
        <div class="dashboard-header interactive-hover">
            <div class="user-info">
                <h3 id="dashUserName">مرحباً بك</h3>
                <span id="dashUserLevel" style="color: var(--text-muted);">المستوى الدراسي</span>
            </div>
            <div class="avatar-box" style="width: 50px; height: 50px; margin:0;">
                <i class="fa-solid fa-user-astronaut" style="font-size: 24px;"></i>
            </div>
        </div>

        <div class="grid-container">
            <!-- قسم التايمر -->
            <div class="timer-card interactive-hover">
                <h3><i class="fa-solid fa-stopwatch" style="color: var(--primary-gold);"></i> مؤقت التركيز</h3>
                <div class="timer-display" id="timerDisplay">25:00</div>
                
                <div id="timerSetup" style="margin-bottom: 15px;">
                    <label style="font-size: 0.9rem; color: var(--text-muted); display: block; margin-bottom: 5px;">حدد مدة الجلسة (بالدقائق):</label>
                    <input type="number" id="customMinutes" value="25" min="1" max="300" style="width: 120px; padding: 8px;">
                </div>

                <div class="timer-controls">
                    <button class="btn" id="startBtn" onclick="handleStartTimer()"><i class="fa-solid fa-play"></i> ابدأ</button>
                    <button class="btn btn-secondary" id="pauseBtn" onclick="pauseTimer()" style="display: none;"><i class="fa-solid fa-pause"></i> مؤقت</button>
                    <button class="btn btn-danger" id="stopBtn" onclick="confirmStopTimer()" style="display: none;"><i class="fa-solid fa-square"></i> توقيف كلي</button>
                </div>
            </div>

            <!-- قسم الأهداف وشريط التقدم -->
            <div class="goals-card interactive-hover">
                <div class="goals-header">
                    <h3><i class="fa-solid fa-bullseye" style="color: var(--primary-gold);"></i> أهدافي للسيشن</h3>
                    <button class="btn" style="padding: 8px 15px; font-size: 0.9rem;" onclick="openGoalModal()"><i class="fa-solid fa-plus"></i> إضافة هدف</button>
                </div>

                <!-- شريط التقدم -->
                <div class="progress-container">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem;">
                        <span>نسبة الإنجاز</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBar"></div>
                        <div class="progress-text" id="progressText">0 / 0 مكتمل</div>
                    </div>
                </div>

                <ul class="goals-list" id="goalsList">
                    <!-- الأهداف تظهر هنا -->
                </ul>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة هدف (Modal) -->
    <div class="modal" id="goalModal">
        <div class="modal-content">
            <h3 style="color: var(--primary-gold); margin-bottom: 15px;"><i class="fa-solid fa-pen-to-square"></i> اكتب هدفك الجديد</h3>
            <input type="text" id="goalInput" placeholder="مثال: حل 5 تمارين رياضيات..." style="margin-bottom: 20px;">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeGoalModal()">إلغاء</button>
                <button class="btn" onclick="addGoal()">حفظ الهدف</button>
            </div>
        </div>
    </div>

    <script>
        // البيانات الأساسية
        let userData = {
            name: '',
            level: '',
            goals: []
        };

        let timerInterval = null;
        let totalSeconds = 0;
        let isPaused = false;

        // نصائح حسب المستوى
        const advices = {
            "الإبتدائي": "التعلم هو مغامرة ممتعة! ركز على فهم الأساسيات ولا تخف من الخطأ، فكل خطوة تقربك أكثر للنجاح.",
            "المتوسط": "هذه مرحلة بناء شخصيتك الدراسية! تنظيم الوقت والتركيز في القسم يوفر عليك نصف جهد المراجعة.",
            "الثانوي": "أنت في مرحلة حاسمة تبني بها مستقبلك! انضبط الآن وابتعد عن المشتتات، فكل دقيقة تعني نقطة فارقة.",
            "الجامعة": "المعرفة لا حدود لها! لا تكتفِ بما تتلقاه، ابحث واكتشف وتعمق، فالتميز يكمن في التعلم الذاتي."
        };

        // توليد أصوات تحفيزية باستخدام Web Audio API
        function playTone(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if(type === 'start') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else if(type === 'complete') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                }
            } catch(e) { console.log('Audio error:', e); }
        }

        // التنقل بين الخطوات
        function goToStep2() {
            const name = document.getElementById('userNameInput').value.trim();
            if(!name) {
                alert('من فضلك اكتب اسمك أولاً!');
                return;
            }
            userData.name = name;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('welcomeUserText').innerText = `أهلاً بك يا ${userData.name}!`;
        }

        function goToStep3() {
            userData.level = document.getElementById('levelSelect').value;
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
            document.getElementById('adviceText').innerText = advices[userData.level];
        }

        function startMainApp() {
            document.getElementById('step3').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            document.getElementById('dashUserName').innerText = `المحارب: ${userData.name}`;
            document.getElementById('dashUserLevel').innerText = `المستوى: ${userData.level}`;
            loadGoals();
        }

        // إدارة المؤقت
        function handleStartTimer() {
            const minsInput = parseInt(document.getElementById('customMinutes').value);
            
            if(!isPaused) {
                if (isNaN(minsInput) || minsInput < 1) {
                    alert('يرجى تحديد وقت صحيح بالدقائق!');
                    return;
                }

                // تنبيه في حال اختيار وقت كبير جداً
                if(minsInput > 90) {
                    alert("أنت هنا لتدرس وقتاً كافياً لتعليمك وليس لتتعب نفسك! إن كنت تعرف ما تفعله اختر الوقت المناسب وابدأ.");
                }

                totalSeconds = minsInput * 60;
            }

            playTone('start');
            
            document.getElementById('timerSetup').style.display = 'none';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'inline-flex';
            document.getElementById('stopBtn').style.display = 'inline-flex';

            isPaused = false;
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                playTone('complete');
                alert("ممتاز جداً! أنهيت الجلسة الدراسية بنجاح، خذ قسطاً من الراحة.");
                resetTimer();
                return;
            }

            totalSeconds--;
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isPaused = true;
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-play"></i> استئناف`;
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function confirmStopTimer() {
            const result = confirm("هل أنت غير قادر أم لا تريد الوصول لمستواك الأفضل؟ تفكر في ذلك جيداً ثم واصل!");
            if(result) {
                clearInterval(timerInterval);
                resetTimer();
            }
        }

        function resetTimer() {
            isPaused = false;
            document.getElementById('timerSetup').style.display = 'block';
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-play"></i> ابدأ`;
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('timerDisplay').innerText = "25:00";
        }

        // إدارة الأهداف وشريط التقدم
        function openGoalModal() {
            document.getElementById('goalModal').style.display = 'flex';
        }

        function closeGoalModal() {
            document.getElementById('goalModal').style.display = 'none';
            document.getElementById('goalInput').value = '';
        }

        function addGoal() {
            const text = document.getElementById('goalInput').value.trim();
            if(!text) return;

            userData.goals.push({ id: Date.now(), text: text, completed: false });
            saveGoals();
            renderGoals();
            closeGoalModal();
        }

        function toggleGoal(id) {
            userData.goals = userData.goals.map(g => {
                if(g.id === id) g.completed = !g.completed;
                return g;
            });
            saveGoals();
            renderGoals();
        }

        function deleteGoal(id) {
            userData.goals = userData.goals.filter(g => g.id !== id);
            saveGoals();
            renderGoals();
        }

        function renderGoals() {
            const list = document.getElementById('goalsList');
            list.innerHTML = '';

            const total = userData.goals.length;
            const completedCount = userData.goals.filter(g => g.completed).length;

            userData.goals.forEach(g => {
                const li = document.createElement('li');
                li.className = `goal-item ${g.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <span>${g.text}</span>
                    <div class="goal-actions">
                        <i class="fa-solid fa-check" onclick="toggleGoal(${g.id})"></i>
                        <i class="fa-solid fa-trash" onclick="deleteGoal(${g.id})"></i>
                    </div>
                `;
                list.appendChild(li);
            });

            // حساب نسبة شريط التقدم القابل للتقسيم تلقائياً
            let percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressText').innerText = `${completedCount} / ${total} مكتمل`;
        }

        function saveGoals() {
            localStorage.setItem('study_goals', JSON.stringify(userData.goals));
        }

        function loadGoals() {
            const saved = localStorage.getItem('study_goals');
            if(saved) {
                userData.goals = JSON.parse(saved);
                renderGoals();
            }
        }
