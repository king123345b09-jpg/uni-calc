<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدراسة الذكية - التحدي والتميز</title>
    <!-- خط تجوال العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #020b18;
            --bg-card: rgba(10, 25, 47, 0.85);
            --primary-gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --deep-blue: #0a192f;
            --accent-blue: #0052cc;
            --light-blue: #64ffda;
            --text-light: #f1f5f9;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            position: relative;
        }

        /* 🌟 خلفية حية ومتحركة بفقاعات وأشكال تفاعلية بالذهبي والأزرق 🌟 */
        .bg-bubbles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #020b18 100%);
        }

        .bubble {
            position: absolute;
            list-style: none;
            display: block;
            border-radius: 50%;
            bottom: -150px;
            animation: floatUp 15s infinite linear;
            backdrop-filter: blur(2px);
        }

        .bubble:nth-child(1) { left: 10%; width: 80px; height: 80px; background: rgba(255, 215, 0, 0.15); border: 1px solid var(--primary-gold); animation-duration: 12s; }
        .bubble:nth-child(2) { left: 20%; width: 30px; height: 30px; background: rgba(0, 82, 204, 0.25); border: 1px solid var(--accent-blue); animation-duration: 8s; animation-delay: 1s; }
        .bubble:nth-child(3) { left: 35%; width: 100px; height: 100px; background: rgba(255, 215, 0, 0.08); border: 1px solid var(--primary-gold); animation-duration: 18s; }
        .bubble:nth-child(4) { left: 50%; width: 50px; height: 50px; background: rgba(0, 82, 204, 0.2); animation-duration: 10s; }
        .bubble:nth-child(5) { left: 65%; width: 120px; height: 120px; background: rgba(255, 215, 0, 0.1); border: 1px solid var(--primary-gold); animation-duration: 14s; }
        .bubble:nth-child(6) { left: 80%; width: 40px; height: 40px; background: rgba(0, 82, 204, 0.3); animation-duration: 9s; }
        .bubble:nth-child(7) { left: 90%; width: 70px; height: 70px; background: rgba(255, 215, 0, 0.12); border: 1px solid var(--primary-gold); animation-duration: 11s; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-1200px) rotate(360deg); opacity: 0; }
        }

        /* 🌟 بطاقات تفاعلية بحواف تضيء عند حركة الماوس 🌟 */
        .glow-box {
            background: var(--bg-card);
            border: 2px solid rgba(255, 215, 0, 0.25);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .glow-box:hover {
            border-color: var(--primary-gold);
            box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px rgba(255, 215, 0, 0.1);
            transform: translateY(-4px);
        }

        .step-card {
            width: 90%;
            max-width: 550px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        /* صورة البروفايل */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .avatar-box {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid var(--primary-gold);
            background: var(--accent-blue);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        .avatar-upload-btn {
            position: absolute; bottom: 0; right: 0;
            background: var(--primary-gold); color: #000;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.9rem;
        }

        h2, h3 { color: var(--primary-gold); margin-bottom: 15px; }
        p { font-size: 1.05rem; line-height: 1.6; margin-bottom: 20px; }

        input[type="text"], input[type="number"], select {
            width: 100%; padding: 14px;
            border-radius: 12px;
            background: var(--deep-blue);
            border: 1px solid var(--accent-blue);
            color: #fff; font-size: 1.05rem; outline: none;
            margin-bottom: 18px; text-align: center;
        }

        input:focus, select:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-gold), #ffae00);
            color: #000; border: none; padding: 12px 30px;
            font-size: 1.05rem; font-weight: bold; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 15px var(--gold-glow);
            display: inline-flex; align-items: center; gap: 8px; justify-content: center;
        }

        .btn:hover { transform: scale(1.05); }
        .btn-secondary { background: transparent; border: 1.5px solid var(--accent-blue); color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }

        /* الشاشة الرئيسية */
        #mainDashboard { display: none; width: 95%; max-width: 1100px; }

        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding: 18px 25px;
        }

        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 850px) { .grid-layout { grid-template-columns: 1fr; } }

        /* 🌟 التايمر الدائري المستقبلي بالذهبي والأزرق 🌟 */
        .timer-card { text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .circle-timer-wrapper {
            position: relative; width: 220px; height: 220px;
            margin: 15px 0; display: flex; align-items: center; justify-content: center;
        }

        .circle-timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: var(--deep-blue); stroke-width: 10; }

        .circle-progress {
            fill: none; stroke: var(--primary-gold);
            stroke-width: 10; stroke-linecap: round;
            stroke-dasharray: 565; stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0px 0px 8px var(--primary-gold));
        }

        .timer-display-inner {
            position: absolute; font-size: 2.8rem; font-weight: 900;
            color: #fff; text-shadow: 0 0 15px var(--primary-gold);
        }

        /* الأهداف وشريط التقدم */
        .progress-bar-bg {
            background: var(--deep-blue); height: 22px; border-radius: 11px;
            overflow: hidden; border: 1px solid var(--accent-blue);
            position: relative; margin: 15px 0;
        }

        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--primary-gold));
            box-shadow: 0 0 10px var(--primary-gold);
        }

        .goals-list { list-style: none; max-height: 220px; overflow-y: auto; text-align: right; }
        .goal-item {
            background: var(--deep-blue); padding: 12px; border-radius: 10px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(0, 82, 204, 0.3);
        }
        .goal-item:hover { border-color: var(--primary-gold); }
        .goal-item.completed span { text-decoration: line-through; opacity: 0.6; }

        /* قسم الإحصائيات والرسم البياني */
        .stats-section { grid-column: 1 / -1; margin-top: 10px; }

        .chart-container {
            display: flex; justify-content: space-around; align-items: flex-end;
            height: 200px; padding-top: 20px; background: var(--deep-blue);
            border-radius: 16px; border: 1px solid rgba(255, 215, 0, 0.2); margin-top: 15px;
        }

        .bar-wrapper { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; width: 12%; }
        .bar {
            width: 100%; max-width: 35px;
            background: linear-gradient(to top, var(--accent-blue), var(--primary-gold));
            border-radius: 6px 6px 0 0; min-height: 4px;
            box-shadow: 0 0 8px var(--gold-glow);
        }

        .bar-label { font-size: 0.85rem; margin-top: 8px; color: var(--text-muted); }
        .bar-value { font-size: 0.75rem; color: var(--primary-gold); margin-bottom: 4px; }

        .account-card {
            background: var(--deep-blue); border: 1px solid var(--accent-blue);
            padding: 12px; border-radius: 12px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; cursor: pointer;
        }
        .account-card:hover { border-color: var(--primary-gold); box-shadow: 0 0 10px var(--gold-glow); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: var(--deep-blue); border: 2px solid var(--primary-gold); border-radius: 20px; padding: 25px; width: 90%; max-width: 450px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- الخلفية الحية برياح وأشكال دائرية متحرّكة -->
    <ul class="bg-bubbles">
        <li class="bubble"></li><li class="bubble"></li><li class="bubble"></li>
        <li class="bubble"></li><li class="bubble"></li><li class="bubble"></li><li class="bubble"></li>
    </ul>

    <!-- الشاشة الأولى: اختيار الحساب (تظهر فقط عند الحاجة أو أول استخدام) -->
    <div id="accountsScreen" class="glow-box step-card" style="display: none;">
        <h2><i class="fa-solid fa-users"></i> مرحباً بك! اختر حسابك</h2>
        <p>اختر حسابك المفضل لمتابعة دراستك أو أنشئ حساباً جديداً:</p>
        <div id="accountsList"></div>
        <button class="btn" onclick="showNewAccountForm()"><i class="fa-solid fa-user-plus"></i> إضافة حساب جديد</button>
    </div>

    <!-- الشاشة الثانية: إنشـاء حساب جديد -->
    <div id="newAccountScreen" class="glow-box step-card" style="display: none;">
        <h2><i class="fa-solid fa-user-gear"></i> إنشاء حساب جديد</h2>
        <div class="avatar-container">
            <div class="avatar-box" id="avatarPreviewBox">
                <i class="fa-solid fa-user" style="font-size: 45px; color: var(--primary-gold);"></i>
            </div>
            <label class="avatar-upload-btn" title="اختر صورة">
                <i class="fa-solid fa-camera"></i>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </label>
        </div>
        <input type="text" id="newUserName" placeholder="أدخل اسمك هنا...">
        <select id="newUserLevel">
            <option value="الإبتدائي">المستوى الابتدائي</option>
            <option value="المتوسط">المستوى المتوسط</option>
            <option value="الثانوي">المستوى الثانوي</option>
            <option value="الجامعة">المرحلة الجامعية</option>
        </select>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-secondary" onclick="cancelNewAccount()">إلغاء</button>
            <button class="btn" onclick="createNewAccount()">حفظ ودخول</button>
        </div>
    </div>

    <!-- واجهة الموقع الرئيسية -->
    <div id="mainDashboard">
        <div class="glow-box dashboard-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="avatar-container" style="width: 55px; height: 55px; margin: 0;">
                    <div class="avatar-box" id="dashAvatarBox"></div>
                </div>
                <div style="text-align: right;">
                    <h3 id="dashUserName" style="margin: 0;">اسم المستخدم</h3>
                    <span id="dashUserLevel" style="color: var(--text-muted); font-size: 0.9rem;">المستوى</span>
                </div>
            </div>
            <button class="btn btn-secondary" style="padding: 8px 15px; font-size: 0.85rem;" onclick="switchAccount()">
                <i class="fa-solid fa-right-from-bracket"></i> تبديل الحساب
            </button>
        </div>

        <div class="grid-layout">
            <!-- التايمر الدائري -->
            <div class="glow-box timer-card">
                <h3><i class="fa-solid fa-stopwatch"></i> مؤقت التركيز الذهبي</h3>
                
                <div class="circle-timer-wrapper">
                    <svg class="circle-timer-svg">
                        <circle class="circle-bg" cx="110" cy="110" r="90"></circle>
                        <circle class="circle-progress" id="circleProgress" cx="110" cy="110" r="90"></circle>
                    </svg>
                    <div class="timer-display-inner" id="timerDisplay">25:00</div>
                </div>
                
                <div id="timerSetup">
                    <label style="color: var(--text-muted); font-size: 0.9rem; display: block; margin-bottom: 5px;">حدد المدة بالدقائق:</label>
                    <input type="number" id="customMinutes" value="25" min="1" max="300" style="width: 120px; padding: 8px;">
                </div>

                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px;">
                    <button class="btn" id="startBtn" onclick="handleStartTimer()"><i class="fa-solid fa-play"></i> ابدأ</button>
                    <button class="btn btn-secondary" id="pauseBtn" onclick="pauseTimer()" style="display: none;"><i class="fa-solid fa-pause"></i> مؤقت</button>
                    <button class="btn btn-danger" id="stopBtn" onclick="confirmStopTimer()" style="display: none;"><i class="fa-solid fa-square"></i> توقيف كلي</button>
                </div>
            </div>

            <!-- الأهداف وشريط التقدم -->
            <div class="glow-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3><i class="fa-solid fa-bullseye"></i> أهدافي اليومية</h3>
                    <button class="btn" style="padding: 6px 12px; font-size: 0.85rem;" onclick="openGoalModal()"><i class="fa-solid fa-plus"></i> إضافة هدف</button>
                </div>

                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">
                    <span id="progressText">0 / 0 مكتمل</span>
                    <span id="progressPercent" style="color: var(--primary-gold); font-weight: bold;">0%</span>
                </div>

                <ul class="goals-list" id="goalsList"></ul>
            </div>

            <!-- الإحصائيات الأسبوعية -->
            <div class="glow-box stats-section">
                <h3><i class="fa-solid fa-chart-column"></i> إحصائيات دراستك هذا الأسبوع</h3>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">تسجيل وقت دراستك تلقائياً عند إكمال المؤقت:</p>
                <div class="chart-container" id="chartContainer"></div>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة هدف -->
    <div class="modal" id="goalModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-pen"></i> إضافة هدف جديد</h3>
            <input type="text" id="goalInput" placeholder="اكتب هدفك هنا...">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeGoalModal()">إلغاء</button>
                <button class="btn" onclick="addGoal()">حفظ الهدف</button>
            </div>
        </div>
    </div>

    <script>
        const motivationalQuotes = [
            "ممتاز جداً! كل هدف تحققه هو خطوة نحو قمتك الشخصية! 🌟",
            "عاش الأبطال! استمر، الإنجازات الصغرى تصنع النجاح الباهر! 🔥",
            "عمل رائع! العظمة ليست حظاً بل انضباطاً كالموجود لديك الآن! 💪",
            "أحسنت! إرادتك هي سلاحك الحقيقي، واصل التحدي! 🚀",
            "بطل! المستقبل يصنعه من يعمل له في هذه اللحظات بالذات! 🏆",
            "يا لها من عزيمة! لا شيء يستطيع إيقافك عندما تركز! ✨",
            "رائع! الاستمرارية هي السر الحقيقي لكل العظماء! 💎",
            "هدف آخر يسقط أمام إرادتك القوية، واصل التألق! ⚡",
            "فخورون بك! كل نقطة عرق وتركيز اليوم هي فرحة الغد! 🎓",
            "ممتاز! أنت تثبت لنفسك كل يوم أنك قادر على المستحيل! 👑",
            "عمل ممتاز! لا تتوقف حتى تصبح فخوراً بكل خطوة! 🌈",
            "رائع جداً! النجاح هو مجموع محاولات صغيرة تتكرر يومياً! 📈",
            "أحسنت القول والفعل! طموحك أعلى بكثير من أي كسول! 💥",
            "واصل الإبداع! شعلة شغفك هي ما يضيء طريقك! 💡",
            "خطوة ممتازة! العقل الناجح هو الذي ينهي ما بدأه! 🧠",
            "إنجاز مبهر! اجعل تركيزك اليوم هو قوتك لغد أفضل! 🎯",
            "أنت على الطريق الصحيح دائماً، واصل يا بطل! 🛣️",
            "ممتاز! من يتعب اليوم يتذوق طعم الحلاوة والنجاح غداً! 🥇",
            "برافو! التركيز هو المفتاح الذهبي لكل الأبواب المغلقة! 🔑",
            "رائع! اجعل إنجازك هذا حافزاً لهدفك التالي! ⏩",
            "عاشت الأيادي! أنت تبني مستقبلك بيديك وبكل ثقة! 🏗️",
            "أحسنت! التحدي هو ما يجعل الحياة ممتعة والنجاح ذا قيمة! 🍁",
            "استمر! التميز ليس حدثاً بل عادة، وأنت اليوم عظيم! 🌟",
            "إرادة من حديد! لا يدمر الأحلام إلا التردد وانت انتصرت عليه! 🛡️",
            "فخور بإنجازك! لا حدود لما يمكنك تحقيقه بالعزيمة! 🌌",
            "ممتاز! العلم والقوة والعمل هم سلاحك للوصول إلى أحلامك! 📚",
            "كل هدف تنجزه يزيد من احترامك لنفسك وقدراتك! 🔥",
            "أحسنت يا بطل! طموحك يستحق كل دقيقة من جهدك! ⏳",
            "عمل متقن! خطوة أخرى وتصل إلى القمة التي تطمح لها! 🏔️",
            "رائع جداً! واصل بهذا الشغف العالي ولن يوقفك أحد! 🚀"
        ];

        const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

        let accounts = [];
        let currentAccountIndex = null;
        let tempAvatarBase64 = '';
        let timerInterval = null;
        let totalSeconds = 0;
        let sessionInitialSeconds = 0;
        let isPaused = false;
        const maxCircleOffset = 565;

        // 🌟 الدخول التلقائي للموقع بالدخول إلى الحساب الأخير 🌟
        window.onload = function() {
            loadAccountsFromStorage();
            
            const lastActiveIndex = localStorage.getItem('last_active_account');
            
            if (accounts.length === 0) {
                showNewAccountForm();
            } else if (lastActiveIndex !== null && accounts[lastActiveIndex]) {
                selectAccount(parseInt(lastActiveIndex));
            } else {
                selectAccount(0);
            }
        };

        function loadAccountsFromStorage() {
            const data = localStorage.getItem('study_app_accounts');
            accounts = data ? JSON.parse(data) : [];
        }

        function saveAccountsToStorage() {
            localStorage.setItem('study_app_accounts', JSON.stringify(accounts));
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    tempAvatarBase64 = evt.target.result;
                    document.getElementById('avatarPreviewBox').innerHTML = `<img src="${tempAvatarBase64}">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function showAccountsScreen() {
            hideAllScreens();
            document.getElementById('accountsScreen').style.display = 'block';
            const listContainer = document.getElementById('accountsList');
            listContainer.innerHTML = '';

            accounts.forEach((acc, index) => {
                const card = document.createElement('div');
                card.className = 'account-card';
                card.onclick = () => selectAccount(index);
                card.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div class="avatar-box" style="width: 45px; height: 45px; border-width: 1.5px;">
                            ${acc.avatar ? `<img src="${acc.avatar}">` : `<i class="fa-solid fa-user" style="color: var(--primary-gold);"></i>`}
                        </div>
                        <div style="text-align: right;">
                            <strong style="color: var(--primary-gold); font-size: 1.05rem;">${acc.name}</strong><br>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">${acc.level}</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left" style="color: var(--primary-gold);"></i>
                `;
                listContainer.appendChild(card);
            });
        }

        function showNewAccountForm() {
            hideAllScreens();
            tempAvatarBase64 = '';
            document.getElementById('avatarPreviewBox').innerHTML = `<i class="fa-solid fa-user" style="font-size: 45px; color: var(--primary-gold);"></i>`;
            document.getElementById('newUserName').value = '';
            document.getElementById('newAccountScreen').style.display = 'block';
        }

        function cancelNewAccount() {
            if(accounts.length > 0) showAccountsScreen();
        }

        function createNewAccount() {
            const name = document.getElementById('newUserName').value.trim();
            const level = document.getElementById('newUserLevel').value;

            if(!name) { alert('من فضلك اكتب اسمك!'); return; }

            const newAcc = {
                name: name,
                level: level,
                avatar: tempAvatarBase64,
                goals: [],
                weeklyStats: [0, 0, 0, 0, 0, 0, 0]
            };

            accounts.push(newAcc);
            saveAccountsToStorage();
            selectAccount(accounts.length - 1);
        }

        function selectAccount(index) {
            currentAccountIndex = index;
            localStorage.setItem('last_active_account', index);
            enterDashboard();
        }

        function enterDashboard() {
            hideAllScreens();
            document.getElementById('mainDashboard').style.display = 'block';
            const acc = accounts[currentAccountIndex];

            document.getElementById('dashUserName').innerText = acc.name;
            document.getElementById('dashUserLevel').innerText = `المستوى: ${acc.level}`;
            
            const dashBox = document.getElementById('dashAvatarBox');
            dashBox.innerHTML = acc.avatar ? `<img src="${acc.avatar}">` : `<i class="fa-solid fa-user" style="font-size: 25px; color: var(--primary-gold);"></i>`;

            renderGoals();
            renderChart();
        }

        function switchAccount() {
            if(timerInterval) clearInterval(timerInterval);
            resetTimer();
            showAccountsScreen();
        }

        function hideAllScreens() {
            document.getElementById('accountsScreen').style.display = 'none';
            document.getElementById('newAccountScreen').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'none';
        }

        // المؤقت
        function handleStartTimer() {
            const minsInput = parseInt(document.getElementById('customMinutes').value);
            
            if(!isPaused) {
                if (isNaN(minsInput) || minsInput < 1) { alert('حدد وقتاً صحيحاً بالدقائق!'); return; }
                if(minsInput > 90) {
                    alert("أنت هنا لتدرس وقتاً كافياً لتعليمك وليس لتتعب نفسك! إن كنت تعرف ما تفعله اختر الوقت المناسب وابدأ.");
                }
                totalSeconds = minsInput * 60;
                sessionInitialSeconds = totalSeconds;
            }

            document.getElementById('timerSetup').style.display = 'none';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'inline-flex';
            document.getElementById('stopBtn').style.display = 'inline-flex';

            isPaused = false;
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("ممتاز جداً! أنهيت جلسة الدراسة بنجاح وحُفظ وقتك بالإحصائيات!");
                recordStudyTime(sessionInitialSeconds);
                resetTimer();
                return;
            }

            totalSeconds--;
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            const progressRatio = totalSeconds / sessionInitialSeconds;
            const offset = maxCircleOffset * (1 - progressRatio);
            document.getElementById('circleProgress').style.strokeDashoffset = offset;
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isPaused = true;
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-play"></i> استئناف`;
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function confirmStopTimer() {
            const result = confirm("هل أنت غير قادر أم لا تريد الوصول لمستواك الأفضل؟ فكر في ذلك جيداً ثم واصل!");
            if(result) {
                clearInterval(timerInterval);
                const elapsed = sessionInitialSeconds - totalSeconds;
                if(elapsed > 10) recordStudyTime(elapsed);
                resetTimer();
            }
        }

        function resetTimer() {
            isPaused = false;
            document.getElementById('timerSetup').style.display = 'block';
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-play"></i> ابدأ`;
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('timerDisplay').innerText = "25:00";
            document.getElementById('circleProgress').style.strokeDashoffset = 0;
        }

        function recordStudyTime(seconds) {
            const todayIndex = new Date().getDay();
            accounts[currentAccountIndex].weeklyStats[todayIndex] += seconds;
            saveAccountsToStorage();
            renderChart();
        }

        function renderChart() {
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';
            const stats = accounts[currentAccountIndex].weeklyStats;
            const maxSecs = Math.max(...stats, 3600);

            daysOfWeek.forEach((day, idx) => {
                const totalSec = stats[idx];
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                const heightPercent = Math.min(100, Math.max(5, (totalSec / maxSecs) * 100));

                const barWrapper = document.createElement('div');
                barWrapper.className = 'bar-wrapper';
                barWrapper.innerHTML = `
                    <div class="bar-value">${mins}د ${secs}ث</div>
                    <div class="bar" style="height: ${heightPercent}%;"></div>
                    <div class="bar-label">${day}</div>
                `;
                container.appendChild(barWrapper);
            });
        }

        function openGoalModal() { document.getElementById('goalModal').style.display = 'flex'; }
        function closeGoalModal() { document.getElementById('goalModal').style.display = 'none'; document.getElementById('goalInput').value = ''; }

        function addGoal() {
            const text = document.getElementById('goalInput').value.trim();
            if(!text) return;

            accounts[currentAccountIndex].goals.push({ id: Date.now(), text: text, completed: false });
            saveAccountsToStorage();
            renderGoals();
            closeGoalModal();
        }

        function toggleGoal(id) {
            const goals = accounts[currentAccountIndex].goals;
            const goal = goals.find(g => g.id === id);
            if(goal) {
                goal.completed = !goal.completed;
                if(goal.completed) {
                    const randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
                    setTimeout(() => alert(randomQuote), 200);
                }
            }
            saveAccountsToStorage();
            renderGoals();
        }

        function deleteGoal(id) {
            accounts[currentAccountIndex].goals = accounts[currentAccountIndex].goals.filter(g => g.id !== id);
            saveAccountsToStorage();
            renderGoals();
        }

        function renderGoals() {
            const list = document.getElementById('goalsList');
            list.innerHTML = '';
            const goals = accounts[currentAccountIndex].goals || [];

            const total = goals.length;
            const completedCount = goals.filter(g => g.completed).length;

            goals.forEach(g => {
                const li = document.createElement('li');
                li.className = `goal-item ${g.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <span>${g.text}</span>
                    <div style="display:flex; gap: 10px;">
                        <i class="fa-solid fa-check" style="color: var(--primary-gold); cursor:pointer;" onclick="toggleGoal(${g.id})"></i>
                        <i class="fa-solid fa-trash" style="color: #e74c3c; cursor:pointer;" onclick="deleteGoal(${g.id})"></i>
                    </div>
                `;
                list.appendChild(li);
            });

            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressText').innerText = `${completedCount} / ${total} مكتمل`;
        }
    </script>
</body>
</html>
