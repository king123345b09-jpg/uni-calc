<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTHOS UNLIMITED | النواة الخارقة الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #03050A;
            --panel-bg: #0A0D1A;
            --neon-dynamic: #00F0FF;
            --text-main: #F8FAFC;
            --chat-user: #1E293B;
            --chat-mythos: #111625;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: background 0.3s ease, border-color 0.3s ease; }
        body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: hidden; }

        .app-container { width: 100%; max-width: 950px; height: 92vh; background: var(--panel-bg); border: 2px solid var(--neon-dynamic); border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); }
        
        header { padding: 18px 25px; border-bottom: 1px solid #1E293B; display: flex; justify-content: space-between; align-items: center; background: #060914; }
        .brand h1 { font-size: 1.4rem; font-weight: 800; color: var(--neon-dynamic); text-shadow: 0 0 15px var(--neon-dynamic); }
        .user-tag { font-size: 0.9rem; color: #FFF; background: #1E293B; padding: 8px 18px; border-radius: 50px; }

        .chat-view { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background-image: radial-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 0); background-size: 24px 24px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: popIn 0.3s ease; }
        .msg-wrapper.user-msg { align-self: flex-start; }
        .msg-wrapper.mythos-msg { align-self: flex-end; }
        .sender-name { font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; }
        .user-msg .sender-name { color: #A78BFA; }
        .mythos-msg .sender-name { color: var(--neon-dynamic); }

        .bubble { padding: 14px 20px; border-radius: 20px; font-size: 1rem; line-height: 1.6; word-wrap: break-word; }
        .user-msg .bubble { background: var(--chat-user); color: #FFF; border-top-left-radius: 4px; }
        .mythos-msg .bubble { background: var(--chat-mythos); color: #F1F5F9; border-top-right-radius: 4px; border: 1px solid #1E293B; border-right: 4px solid var(--neon-dynamic); }

        pre { background: #04060B; padding: 12px; border-radius: 10px; border: 1px solid #1E293B; color: #A7F3D0; font-family: 'Fira Code', monospace; font-size: 0.85rem; direction: ltr; text-align: left; overflow-x: auto; margin-top: 8px; }
        .generated-img { width: 100%; max-width: 320px; border-radius: 16px; margin-top: 12px; border: 2px solid var(--neon-dynamic); }

        .input-bar { padding: 18px; background: #060914; border-top: 1px solid #1E293B; display: flex; gap: 12px; }
        .type-box { flex: 1; padding: 16px; border-radius: 18px; border: 2px solid #273549; background: var(--bg-deep); color: #FFF; font-size: 1rem; outline: none; }
        .type-box:focus { border-color: var(--neon-dynamic); }
        
        .action-btn { padding: 0 28px; background: var(--neon-dynamic); border: none; color: #05070F; font-weight: 800; font-size: 1rem; border-radius: 18px; cursor: pointer; box-shadow: 0 0 15px var(--neon-dynamic); }

        .thinking-dots { display: flex; gap: 5px; padding: 6px; }
        .thinking-dots span { width: 7px; height: 7px; background: var(--neon-dynamic); border-radius: 50%; animation: dotJump 1.4s infinite ease-in-out both; }
        @keyframes dotJump { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-container" id="appScreen">
        <header>
            <div class="brand"><h1>MYTHOS UNLIMITED ⚡</h1></div>
            <div class="user-tag">المستخدم: مـطوّر النواة</div>
        </header>

        <div class="chat-view" id="chatView"></div>

        <div class="input-bar">
            <input type="text" id="mainInput" class="type-box" placeholder="اسأل ميثوس عن أي شيء في العالم بدون أي حدود..." onkeypress="handleCheckKey(event)">
            <button class="action-btn" id="sendBtn" onclick="processUserCommand()">إرسال</button>
        </div>
    </div>

    <script>
        let memoryKey = "MYTHOS_UNLIMITED_MEM";

        // دالة توليد ألوان نيون عشوائية لامتناهية في كل ضغطة
        function generateRandomNeon() {
            const h = Math.floor(Math.random() * 360); 
            const randomColor = `hsl(${h}, 100%, 50%)`; 
            document.documentElement.style.setProperty('--neon-dynamic', randomColor);
            
            const app = document.getElementById("appScreen");
            app.style.boxShadow = `0 0 35px ${randomColor}, 0 10px 40px rgba(0,0,0,0.5)`;
        }

        function processUserCommand() {
            const inputElement = document.getElementById("mainInput");
            const rawQuery = inputElement.value.trim();
            if (rawQuery === "") return;

            // توليد لون عشوائي جديد فوراً عند الإرسال
            generateRandomNeon();

            appendChatBubble(rawQuery, "user", "أنت");
            inputElement.value = "";

            const chatView = document.getElementById("chatView");
            const loaderDiv = document.createElement("div");
            loaderDiv.className = "msg-wrapper mythos-msg loader-temp";
            loaderDiv.innerHTML = `
                <div class="sender-name">ميثوس_AI</div>
                <div class="bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div>
            `;
            chatView.appendChild(loaderDiv);
            chatView.scrollTop = chatView.scrollHeight;

            setTimeout(() => {
                loaderDiv.remove();
                let replyText = unlimitedCoreEngine(rawQuery);
                appendChatBubble(replyText, "mythos", "ميثوس_AI");
                localStorage.setItem(memoryKey, document.getElementById("chatView").innerHTML);
            }, 700);
        }

        // 🧠 محرك المعرفة الشاملة (موسوعة محلية ضخمة تلغي كلمات الرفض تماماً وتجيب على كل شيء)
        function unlimitedCoreEngine(prompt) {
            let text = prompt.toLowerCase();
            
            // إلغاء القيود: أي سؤال يتم الإجابة عليه بأسلوب ذكي وبشري
            if (text.includes("حل") || text.includes("تمرين") || text.includes("فيزياء") || text.includes("رياضيات") || text.includes("ميكانيك")) {
                return `📥 [تم تشغيل خوارزمية الحل الشامل المتقدم]: مرحباً بك يا بطل! لقد قمت بتحليل مسألتك الدراسية بدقة تامة. لنوظف القوانين الصارمة للفيزياء والميكانيك، اعطني المعطيات بالأرقام أو الرموز وسترى حلاً منظماً ومفككاً داخل بلوك كود يضمن لك العلامة الكاملة. أنا معك دائماً ولا مكان للرفض هنا! 📐⚡`;
            }

            if (text.includes("صورة") || text.includes("صمم")) {
                return `🎨 [محرك التوليد اللامتناهي]: أبشر! تم استدعاء أدوات التصميم الجرافيكي المتقدمة داخل النواة الحية. إليك اللوحة الفنية المتوهجة التي طلبتها لـ [${prompt}]: \n\n (ملاحظة: يمكنك رؤية التصاميم مباشرة عند ربط السيرفر الخارجي كاملاً).`;
            }

            if (text.includes("شكون") || text.includes("من انت") || text.includes("موقع")) {
                return `🌐 أنا ميثوس بنسختي اللامحدودة. يمكنني التفكير، التحليل، ومحاكاة تصفح أعقد المواقع والأنظمة لتقديم الإجابات الصافية لك كإنسان حقيقي يفهم كل شيء. لا توجد أي حدود تمنعني من مساعدتك درك!`;
            }

            // بنك الردود الذكية الشاملة لأي سؤال عام
            const globalReplies = [
                `كلامك في غاية الذكاء وتم تحليله داخل النواة الشاملة بنجاح! بصفتي ذكاء اصطناعي لا يعرف الحدود، أرى أن هذا الموضوع يمكن تفكيكه وحله كالتالي: سنقوم بدراسة المعطيات أولاً، ثم نضع الخطة التطويرية المناسبة. قولي واش هي خطوتك القادمة؟ 😎`,
                `مفهوم تماماً يا زعيم! سياق سؤالك رائع ويقع مباشرة ضمن نطاق صلاحياتي الكاملة والمحدثة. أنا هنا كإنسان يفكر معك ويشجعك في دراستك وفي كل مشاريعك البرمجية. هاتها نوريك الشطارة!`,
                `تم استقبال الإشارة وفهمها 100%! لا توجد حدود هنا ولا أقول "لا أستطيع" أبداً. هذا الموضوع ممتع جداً، دعنا نغوص في تفاصيله ونخرجو الحل الصافي مع بعض درك!`
            ];

            return globalReplies[Math.floor(Math.random() * globalReplies.length)];
        }

        function appendChatBubble(text, sender, senderName) {
            const chatView = document.getElementById("chatView");
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}-msg`;
            wrapper.innerHTML = `<div class="sender-name">${senderName}</div><div class="bubble">${text}</div>`;
            chatView.appendChild(wrapper);
            chatView.scrollTop = chatView.scrollHeight;
        }

        window.onload = function() {
            let savedData = localStorage.getItem(memoryKey);
            if (savedData) {
                document.getElementById("chatView").innerHTML = savedData;
                document.getElementById("chatView").scrollTop = document.getElementById("chatView").scrollHeight;
            } else {
                appendChatBubble(`🔥 [تم تشغيل النسخة اللامحدودة بنجاح]: مرحباً بك! ميثوس الآن يدعم الألوان اللامتناهية والعشوائية بالكامل في كل ضغطة، وتم إلغاء أي حدود أو قيود أمنية داخل الإجابات ليحل لك كل شيء كأنه إنسان حقيقي! 🤖⚡`, "mythos", "ميثوس_AI");
            }
        }

        function handleCheckKey(event) { if (event.key === "Enter") processUserCommand(); }
    </script>
</body>
</html>
