<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ حساب معدل المتوسط</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040610;
            --card-bg: #0B0F1F;
            --neon-color: #00F0FF;
            --text-light: #F8FAFC;
            --border-glow: rgba(0, 240, 255, 0.2);
            --neon-green: #39FF14;
            --neon-red: #FF3131;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: background 0.3s ease, border-color 0.3s ease; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }

        .container { width: 100%; max-width: 850px; background: var(--card-bg); border: 2px solid var(--neon-color); border-radius: 25px; padding: 30px; box-shadow: 0 0 40px var(--border-glow); position: relative; }
        
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed rgba(255,255,255,0.1); padding-bottom: 20px; }
        .header h1 { font-size: 2rem; font-weight: 900; color: var(--neon-color); text-shadow: 0 0 20px var(--neon-color); }
        
        .step-panel { display: none; }
        .step-panel.active { display: block; animation: slideIn 0.4s ease forwards; }

        label { display: block; font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; color: #CBD5E1; }
        .input-field { width: 100%; padding: 15px; background: #060914; border: 2px solid #1E293B; border-radius: 14px; color: #FFF; font-size: 1.1rem; outline: none; text-align: center; margin-bottom: 20px; }
        .input-field:focus { border-color: var(--neon-color); box-shadow: 0 0 15px var(--border-glow); }

        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .action-btn { padding: 14px 35px; background: var(--neon-color); border: none; color: #040610; font-weight: 800; font-size: 1.1rem; border-radius: 15px; cursor: pointer; box-shadow: 0 0 15px var(--neon-color); transform: scale(1); }
        .action-btn:hover { transform: scale(1.03); filter: brightness(1.2); }
        .btn-secondary { background: #1E293B; color: #FFF; box-shadow: none; border: 1px solid #334155; }
        .btn-danger { background: var(--neon-red); color: white; box-shadow: 0 0 15px var(--neon-red); }

        .grid-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .option-card { background: #060914; border: 2px solid #1E293B; padding: 20px; border-radius: 16px; text-align: center; cursor: pointer; font-weight: 700; font-size: 1.1rem; }
        .option-card:hover, .option-card.selected { border-color: var(--neon-color); background: rgba(0, 240, 255, 0.05); box-shadow: 0 0 15px var(--border-glow); color: var(--neon-color); }

        /* جداول متطورة */
        .subjects-table { width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 25px; }
        .subjects-table th { background: #060914; padding: 14px; text-align: center; color: var(--neon-color); font-weight: 700; border-bottom: 2px solid #1E293B; }
        .subjects-table td { padding: 12px; border-bottom: 1px solid #1E293B; text-align: center; }
        
        /* حقول إدخال النقاط الذكية */
        .sub-input { width: 75px; padding: 8px; background: #040610; border: 2px solid #334155; border-radius: 8px; color: #FFF; text-align: center; font-weight: 700; font-size: 1.05rem; }
        .sub-input.score-pass { border-color: var(--neon-green) !important; color: var(--neon-green) !important; text-shadow: 0 0 5px rgba(57, 255, 20, 0.3); }
        .sub-input.score-fail { border-color: var(--neon-red) !important; color: var(--neon-red) !important; text-shadow: 0 0 5px rgba(255, 49, 49, 0.3); }

        .badge-coeff { background: #1E293B; padding: 4px 10px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; }
        .optional-switch { background: #161B33; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        /* واجهة النتيجة الإجمالية الملونة */
        .result-box { text-align: center; padding: 30px; background: rgba(6, 9, 20, 0.7); border: 3px solid var(--neon-color); border-radius: 20px; margin-top: 20px; box-shadow: 0 0 30px var(--border-glow); }
        .result-val { font-size: 3.8rem; font-weight: 900; margin: 15px 0; }
        .result-val.pass { color: var(--neon-green); text-shadow: 0 0 30px var(--neon-green); }
        .result-val.fail { color: var(--neon-red); text-shadow: 0 0 30px var(--neon-red); }
        .status-text { font-size: 1.5rem; font-weight: 700; }

        /* مساحة مراجعة النقاط */
        .review-section { margin-top: 30px; border-top: 2px dashed #334155; padding-top: 20px; text-align: right; }
        .review-title { color: var(--neon-color); font-weight: 800; font-size: 1.3rem; margin-bottom: 15px; text-align: center; }
        .text-pass { color: var(--neon-green) !important; font-weight: bold; }
        .text-fail { color: var(--neon-red) !important; font-weight: bold; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .subjects-table th { font-size: 0.8rem; padding: 6px; } .sub-input { width: 55px; font-size: 0.9rem; } .container { padding: 15px; } }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="header">
            <h1 id="appTitle">📊 نضام حساب المعدل في الطور المتوسط ⚡</h1>
        </div>

        <!-- الخطوة 1: طلب الاسم -->
        <div class="step-panel active" id="step1">
            <label for="userName">السلام عليكم ! واش إسمك؟</label>
            <input type="text" id="userName" class="input-field" placeholder="اكتب اسمك هنا..." autocomplete="off">
            <div class="btn-group">
                <button class="action-btn" onclick="goToStep2()">التالي ⚡</button>
            </div>
        </div>

        <!-- الخطوة 2: اختيار السنة الدراسية -->
        <div class="step-panel" id="step2">
            <label id="welcomeLabel">اختر السنة الدراسية:</label>
            <div class="grid-options" id="yearOptionsContainer">
                <div class="option-card" data-y="1" onclick="selectYear(1, this)">السنة الأولى متوسط</div>
                <div class="option-card" data-y="2" onclick="selectYear(2, this)">السنة الثانية متوسط</div>
                <div class="option-card" data-y="3" onclick="selectYear(3, this)">السنة الثالثة متوسط</div>
                <div class="option-card" data-y="4" onclick="selectYear(4, this)">السنة الرابعة متوسط (BEM)</div>
            </div>
            <div class="btn-group">
                <button class="action-btn btn-secondary" onclick="goBack(1)">رجوع</button>
                <button class="action-btn" onclick="goToStep3()">التالي ⚡</button>
            </div>
        </div>

        <!-- الخطوة 3: اختيار الفصل أو الشهادة -->
        <div class="step-panel" id="step3">
            <label>إختر الفصل لي راك فيه:</label>
            <div class="grid-options" id="periodOptions"></div>
            <div class="btn-group">
                <button class="action-btn btn-secondary" onclick="goBack(2)">رجوع</button>
                <button class="action-btn" onclick="goToStep4()">اإدخال النقا 🔥</button>
            </div>
        </div>

        <!-- الخطوة 4: كشف وإدخال النقاط -->
        <div class="step-panel" id="step4">
            <h3 style="text-align: center; margin-bottom: 15px; color: var(--neon-color);" id="tableTitle">كشف النقاط</h3>
            
            <div class="optional-switch">
                <span>هل تدرس مادة اللغة الأمازيغية؟</span>
                <input type="checkbox" id="hasAmazigh" onchange="toggleAmazighData()" style="width: 20px; height: 20px; cursor: pointer;">
            </div>
            <div class="optional-switch" id="drawingContainer">
                <span>هل تدرس التربية التشكيلية/الموسيقية؟</span>
                <input type="checkbox" id="hasDrawing" checked onchange="toggleDrawingData()" style="width: 20px; height: 20px; cursor: pointer;">
            </div>

            <div style="overflow-x: auto;">
                <table class="subjects-table">
                    <thead>
                        <tr id="tableHeaderRow"></tr>
                    </thead>
                    <tbody id="subjectsBody"></tbody>
                </table>
            </div>

            <div class="btn-group">
                <button class="action-btn btn-secondary" onclick="goBack(3)">رجوع</button>
                <button class="action-btn" onclick="calculateFinalScore()">احسب المعدل  🚀</button>
            </div>
        </div>

        <!-- الخطوة 5: عرض النتيجة الخرافية والتقرير الشامل والذاكرة المكتوبة -->
        <div class="step-panel" id="step5">
            <div class="result-box">
                <h2 id="congratsUser">ألف مبروك!</h2>
                <p:>معدلك هو</p:></p>
                <div class="result-val" id="finalGrade">00.00</div>
                <div class="status-text" id="statusMessage">ناجح!</div>
            </div>

            <!-- تقرير عرض كافة النقاط التي تم إدخالها مع تلوينها تلقائياً -->
            <div class="review-section">
                <div class="review-title">📋 نفاصيل نقاطك التي كتبتها:</div>
                <div style="overflow-x: auto;">
                    <table class="subjects-table" style="margin-top:10px;">
                        <thead>
                            <tr id="reviewHeaderRow"></tr>
                        </thead>
                        <tbody id="reviewTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="btn-group">
                <button class="action-btn btn-secondary" onclick="goBack(4)">تعديل النقاط الحالية ✏️</button>
                <button class="action-btn btn-danger" onclick="clearSavedMemory()">مسح المعلومات 🧹</button>
            </div>
        </div>

    </div>

    <script>
        let userData = { name: "", year: 0, period: "" };
        let scoresStorageKey = "ALGERIAN_BEM_SCORES_STORAGE";
        
        const coefficientsData = {
            1: { arabic: 2, math: 2, french: 1, science: 1, physics: 1, history_geo: 2, islamic: 1, civic: 1, english: 1, sport: 1, drawing: 1, amazigh: 2 },
            2: { arabic: 3, math: 3, french: 2, science: 1, physics: 1, history_geo: 2, islamic: 1, civic: 1, english: 1, sport: 1, drawing: 1, amazigh: 2 },
            3: { arabic: 3, math: 3, french: 2, science: 1, physics: 1, history_geo: 2, islamic: 1, civic: 1, english: 1, sport: 1, drawing: 1, amazigh: 2 },
            4: { 
                fasp: { arabic: 5, math: 4, french: 3, english: 2, science: 2, physics: 2, history_geo: 3, islamic: 2, civic: 1, sport: 1, drawing: 1, amazigh: 2 },
                bem: { arabic: 5, math: 4, french: 3, english: 2, science: 2, physics: 2, history_geo: 3, islamic: 2, civic: 1, sport: 1, drawing: 1, amazigh: 2 }
            }
        };

        const subjectNames = {
            arabic: "اللغة العربية", math: "الرياضيات", french: "اللغة الفرنسية", english: "اللغة الإنجليزية",
            science: "علوم الطبيعة والحياة", physics: "العلوم الفيزيائية", history_geo: "التاريخ والجغرافيا",
            islamic: "التربية الإسلامية", civic: "التربية المدنية", sport: "التربية البدنية",
            drawing: "الرسم / الموسيقى", amazigh: "اللغة الأمازيغية"
        };

        function triggerInfiniteNeon() {
            const randomHue = Math.floor(Math.random() * 360);
            document.documentElement.style.setProperty('--neon-color', `hsl(${randomHue}, 100%, 50%)`);
        }

        // دالة فحص وتلوين حقول الإدخال حية عند الكتابة (خضر أو حمر)
        function colorizeInput(inputEl) {
            let val = parseFloat(inputEl.value);
            if(isNaN(val)) {
                inputEl.classList.remove("score-pass", "score-fail");
            } else if (val >= 10) {
                inputEl.classList.add("score-pass");
                inputEl.classList.remove("score-fail");
            } else {
                inputEl.classList.add("score-fail");
                inputEl.classList.remove("score-pass");
            }
            saveCurrentInputsToMemory(); // حفظ فوري للنقاط في الذاكرة
        }

        function goToStep2() {
            const nameInput = document.getElementById("userName").value.trim();
            if(nameInput === "") { alert("من فضلك اكتب اسمك أولاً!"); return; }
            userData.name = nameInput;
            document.getElementById("welcomeLabel").innerText = `يا ${userData.name}، اختر السنة الدراسية الحالية:`;
            saveCurrentInputsToMemory();
            switchPanel(1, 2);
        }

        function selectYear(yearNum, element) {
            userData.year = yearNum;
            document.querySelectorAll("#step2 .option-card").forEach(el => el.classList.remove("selected"));
            element.classList.add("selected");
            saveCurrentInputsToMemory();
            triggerInfiniteNeon();
        }

        function goToStep3() {
            if(userData.year === 0) { alert("من فضلك اختر السنة الدراسية!"); return; }
            const periodOptions = document.getElementById("periodOptions");
            periodOptions.innerHTML = "";

            if(userData.year === 4) {
                periodOptions.innerHTML = `
                    <div class="option-card" data-p="1" onclick="selectPeriod('1', this)">الفصل الأول</div>
                    <div class="option-card" data-p="2" onclick="selectPeriod('2', this)">الفصل الثاني</div>
                    <div class="option-card" data-p="3" onclick="selectPeriod('3', this)">الفصل الثالث</div>
                    <div class="option-card" data-p="bem" onclick="selectPeriod('bem', this)">📥 حساب معدل شهادة الـ BEM</div>
                `;
            } else {
                periodOptions.innerHTML = `
                    <div class="option-card" data-p="1" onclick="selectPeriod('1', this)">الفصل الأول</div>
                    <div class="option-card" data-p="2" onclick="selectPeriod('2', this)">الفصل الثاني</div>
                    <div class="option-card" data-p="3" onclick="selectPeriod('3', this)">الفصل الثالث</div>
                `;
            }

            // استعادة الاختيار المحفوظ إن وُجد
            let saved = getMemory();
            if(saved && saved.period) {
                let card = periodOptions.querySelector(`[data-p="${saved.period}"]`);
                if(card) selectPeriod(saved.period, card);
            }

            switchPanel(2, 3);
        }

        function selectPeriod(p, element) {
            userData.period = p;
            document.querySelectorAll("#step3 .option-card").forEach(el => el.classList.remove("selected"));
            element.classList.add("selected");
            saveCurrentInputsToMemory();
            triggerInfiniteNeon();
        }

        function goToStep4() {
            if(!userData.period) { alert("من فضلك اختر الفصل الدراسي!"); return; }
            if(userData.period === 'bem') {
                document.getElementById("tableTitle").innerText = `نقاط شهادة التعليم المتوسط (BEM) - يا ${userData.name}`;
                document.getElementById("drawingContainer").style.display = "none";
            } else {
                document.getElementById("tableTitle").innerText = `نقاط الفصل ${userData.period} - الطور ${userData.year} متوسط`;
                document.getElementById("drawingContainer").style.display = "flex";
            }

            renderSubjectsTable();
            switchPanel(3, 4);
        }

        function toggleAmazighData() { saveCurrentInputsToMemory(); renderSubjectsTable(); }
        function toggleDrawingData() { saveCurrentInputsToMemory(); renderSubjectsTable(); }

        function renderSubjectsTable() {
            const headerRow = document.getElementById("tableHeaderRow");
            const body = document.getElementById("subjectsBody");
            body.innerHTML = "";

            if(userData.period === 'bem') {
                headerRow.innerHTML = `<th>المادة</th><th>المعامل</th><th>نقطة الشهادة (من 20)</th>`;
            } else {
                headerRow.innerHTML = `<th>المادة</th><th>المعامل</th><th>تقويم مستمر</th><th>الفرض</th><th>الاختبار</th>`;
            }

            let coeffs = (userData.year === 4) ? coefficientsData[4].fasp : coefficientsData[userData.year];
            if(userData.period === 'bem') coeffs = coefficientsData[4].bem;

            let saved = getMemory();

            for (let subKey in coeffs) {
                if(subKey === 'amazigh' && !document.getElementById("hasAmazigh").checked) continue;
                if(subKey === 'drawing' && !document.getElementById("hasDrawing").checked && userData.period !== 'bem') continue;

                const tr = document.createElement("tr");
                
                // جلب القيم القديمة المحفوظة في ذاكرة الكومبيوتر للتعرف عليها تلقائياً
                let oldExam = (saved && saved.scores && saved.scores[subKey] && saved.scores[subKey].exam) ? saved.scores[subKey].exam : "";
                let oldCa = (saved && saved.scores && saved.scores[subKey] && saved.scores[subKey].ca) ? saved.scores[subKey].ca : "";
                let oldQuiz = (saved && saved.scores && saved.scores[subKey] && saved.scores[subKey].quiz) ? saved.scores[subKey].quiz : "";

                if(userData.period === 'bem') {
                    tr.innerHTML = `
                        <td style="font-weight:bold;">${subjectNames[subKey]}</td>
                        <td><span class="badge-coeff">${coeffs[subKey]}</span></td>
                        <td><input type="number" step="0.01" value="${oldExam}" class="sub-input score-field" data-subject="${subKey}" data-type="exam" oninput="colorizeInput(this)"></td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td style="font-weight:bold;">${subjectNames[subKey]}</td>
                        <td><span class="badge-coeff">${coeffs[subKey]}</span></td>
                        <td><input type="number" step="0.01" value="${oldCa}" class="sub-input" data-subject="${subKey}" data-type="ca" oninput="colorizeInput(this)"></td>
                        <td><input type="number" step="0.01" value="${oldQuiz}" class="sub-input" data-subject="${subKey}" data-type="quiz" oninput="colorizeInput(this)"></td>
                        <td><input type="number" step="0.01" value="${oldExam}" class="sub-input" data-subject="${subKey}" data-type="exam" oninput="colorizeInput(this)"></td>
                    `;
                }
                body.appendChild(tr);
                
                // تلوين الحقول بعد استرجاعها مباشرة
                tr.querySelectorAll("input").forEach(inp => colorizeInput(inp));
            }
        }

        // حفظ قاع المعطيات الحالية في LocalStorage
        function saveCurrentInputsToMemory() {
            let currentScores = {};
            document.querySelectorAll("#subjectsBody tr").forEach(tr => {
                let examInp = tr.querySelector('[data-type="exam"]');
                if(!examInp) return;
                let subKey = examInp.getAttribute("data-subject");
                
                currentScores[subKey] = {
                    exam: examInp.value,
                    ca: tr.querySelector('[data-type="ca"]') ? tr.querySelector('[data-type="ca"]').value : "",
                    quiz: tr.querySelector('[data-type="quiz"]') ? tr.querySelector('[data-type="quiz"]').value : ""
                };
            });

            let fullPackage = {
                name: document.getElementById("userName").value,
                year: userData.year,
                period: userData.period,
                hasAmazigh: document.getElementById("hasAmazigh").checked,
                hasDrawing: document.getElementById("hasDrawing").checked,
                scores: currentScores
            };
            localStorage.setItem(scoresStorageKey, JSON.stringify(fullPackage));
        }

        function getMemory() {
            let data = localStorage.getItem(scoresStorageKey);
            return data ? JSON.parse(data) : null;
        }

        function calculateFinalScore() {
            saveCurrentInputsToMemory(); // تأكيد الحفظ
            let totalPoints = 0;
            let totalCoeffs = 0;
            let error = false;

            let coeffs = (userData.year === 4) ? coefficientsData[4].fasp : coefficientsData[userData.year];
            if(userData.period === 'bem') coeffs = coefficientsData[4].bem;

            const reviewBody = document.getElementById("reviewTableBody");
            const reviewHeaderRow = document.getElementById("reviewHeaderRow");
            reviewBody.innerHTML = "";

            if(userData.period === 'bem') {
                reviewHeaderRow.innerHTML = `<th>المادة</th><th>المعامل</th><th>الدرجة المكتوبة</th>`;
            } else {
                reviewHeaderRow.innerHTML = `<th>المادة</th><th>المعامل</th><th>تقويم</th><th>فرض</th><th>اختبار</th><th>معدل المادة</th>`;
            }

            document.querySelectorAll("#subjectsBody tr").forEach(tr => {
                if(error) return;
                let examInput = tr.querySelector('[data-type="exam"]');
                let subKey = examInput.getAttribute("data-subject");
                let coeff = coeffs[subKey];
                let examVal = parseFloat(examInput.value);

                if(isNaN(examVal) || examVal < 0 || examVal > 20) { error = true; return; }

                let revTr = document.createElement("tr");

                if(userData.period === 'bem') {
                    let cls = examVal >= 10 ? 'text-pass' : 'text-fail';
                    revTr.innerHTML = `<td>${subjectNames[subKey]}</td><td><span class="badge-coeff">${coeff}</span></td><td class="${cls}">${examVal.toFixed(2)}</td>`;
                    totalPoints += examVal * coeff;
                    totalCoeffs += coeff;
                } else {
                    let caVal = parseFloat(tr.querySelector('[data-type="ca"]').value);
                    let quizVal = parseFloat(tr.querySelector('[data-type="quiz"]').value);

                    if(isNaN(caVal) || caVal < 0 || caVal > 20 || isNaN(quizVal) || quizVal < 0 || quizVal > 20) { error = true; return; }

                    let subAvgActivity = (caVal + quizVal) / 2;
                    let subjectFinalAvg = (subAvgActivity + (examVal * 2)) / 3;

                    totalPoints += subjectFinalAvg * coeff;
                    totalCoeffs += coeff;

                    let cCls = caVal >= 10 ? 'text-pass' : 'text-fail';
                    let qCls = quizVal >= 10 ? 'text-pass' : 'text-fail';
                    let eCls = examVal >= 10 ? 'text-pass' : 'text-fail';
                    let fCls = subjectFinalAvg >= 10 ? 'text-pass' : 'text-fail';

                    revTr.innerHTML = `
                        <td>${subjectNames[subKey]}</td><td><span class="badge-coeff">${coeff}</span></td>
                        <td class="${cCls}">${caVal.toFixed(2)}</td><td class="${qCls}">${quizVal.toFixed(2)}</td>
                        <td class="${eCls}">${examVal.toFixed(2)}</td><td class="${fCls}">${subjectFinalAvg.toFixed(2)}</td>
                    `;
                }
                reviewBody.appendChild(revTr);
            });

            if(error) { alert("خطأ: يرجى ملء وتصحيح كافة حقول وعلامات المواد بين 0 و 20!"); return; }

            let finalAvg = totalPoints / totalCoeffs;
            let gradeEl = document.getElementById("finalGrade");
            gradeEl.innerText = finalAvg.toFixed(2);

            // تلوين النتيجة النهائية الكبرى
            if(finalAvg >= 10) {
                gradeEl.className = "result-val pass";
                document.getElementById("statusMessage").innerText = finalAvg >= 16 ? "ناجح بتفوق وامتياز باهر! 🏆" : "ناجح ومبروك الانتقال! 🎓";
                document.getElementById("congratsUser").innerText = `ألف مبروك يا ${userData.name}! ✨`;
            } else {
                gradeEl.className = "result-val fail";
                document.getElementById("statusMessage").innerText = "النتيجة دون المعدل المطلوب، يمكنك التعويض!";
                document.getElementById("congratsUser").innerText = `حظ أوفر في المرة القادمة يا ${userData.name} 💪`;
            }

            switchPanel(4, 5);
        }

        function switchPanel(from, to) {
            document.getElementById(`step${from}`).classList.remove("active");
            document.getElementById(`step${to}`).classList.add("active");
            triggerInfiniteNeon();
        }

        function goBack(toStep) { switchPanel(toStep + 1, toStep); }

        function clearSavedMemory() {
            if(confirm("هل أنت متأكد من مسح كافة النقاط المكتوبة والبيانات المحفوظة؟")) {
                localStorage.removeItem(scoresStorageKey);
                document.getElementById("userName").value = "";
                document.getElementById("hasAmazigh").checked = false;
                document.getElementById("hasDrawing").checked = true;
                userData = { name: "", year: 0, period: "" };
                document.querySelectorAll(".option-card").forEach(el => el.classList.remove("selected"));
                switchPanel(5, 1);
            }
        }

        // كود استعادة الذاكرة الفوري عند فتح الموقع
        window.onload = function() {
            let saved = getMemory();
            if(saved && saved.name) {
                document.getElementById("userName").value = saved.name;
                userData.name = saved.name;
                
                if(saved.year) {
                    userData.year = saved.year;
                    let yearCard = document.querySelector(`[data-y="${saved.year}"]`);
                    if(yearCard) yearCard.classList.add("selected");
                }
                if(saved.hasAmazigh) document.getElementById("hasAmazigh").checked = saved.hasAmazigh;
                if(saved.hasDrawing !== undefined) document.getElementById("hasDrawing").checked = saved.hasDrawing;
                
                // نقله مباشرة لخطوة اختيار الفصل لتوفير الوقت
                goToStep3();
            }
        }
    </script>
</body>
</html>
