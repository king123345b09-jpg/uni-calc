<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع العالمي لحساب المعدل الجامعي المطور</title>
    <style>
        :root {
            --bg-color: #0B132B; 
            --card-bg: #1C2541; 
            --primary: #FF7B00; 
            --accent: #FFD700;  
            --text-main: #FFFFFF;
            --success: #39FF14; 
            --danger: #FF3131;  
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* شاشة الترحيب */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1c2541 0%, #0b132b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .fade-out {
            animation: fadeOut 1.5s ease-in-out forwards;
        }

        .intro-title {
            font-size: 2.3rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 15px;
            text-align: center;
        }

        .intro-subtitle {
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* الحاوية الرئيسية */
        .main-container {
            width: 95%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px; 
            border: 2px solid var(--accent); 
            box-shadow: 0 0 30px rgba(255, 123, 0, 0.2);
            margin: 40px 0;
            display: none;
        }

        .step-panel {
            display: none; 
            text-align: center;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .step-panel.active {
            display: block; 
        }

        .step-title {
            color: var(--accent);
            margin-bottom: 25px;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }

        .option-btn {
            padding: 15px;
            background: #0B132B;
            border: 2px solid #415A77;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.3);
            transform: scale(1.02);
        }

        .name-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #415A77;
            background-color: #0B132B;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.4s ease;
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        /* نافيجيشن التبديل بين السنوات والسداسيات */
        .dashboard-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .year-navigation, .semester-navigation {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            background: #0B132B;
            padding: 8px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .year-btn, .sem-btn {
            flex: 1;
            padding: 10px 5px;
            background: transparent;
            border: none;
            color: #A0AEC0;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .year-btn.active, .sem-btn.active {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: #0B132B;
            box-shadow: 0 0 12px var(--primary);
        }

        .user-welcome-tag {
            text-align: center;
            color: var(--accent);
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            margin-bottom: 5px;
        }

        .info-tag {
            text-align: center;
            color: #A0AEC0;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* 📊 جدول عرض المواد (نفس ستايل الموقع المستهدف) */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 25px;
            border-radius: 12px;
            border: 1px solid #415A77;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: rgba(11, 19, 43, 0.7);
        }

        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid rgba(65, 90, 119, 0.4);
            font-size: 1rem;
        }

        th {
            background-color: #0B132B;
            color: var(--accent);
            font-weight: bold;
        }

        .subject-title {
            text-align: right;
            font-weight: bold;
            color: #FFFFFF;
            padding-right: 15px;
        }

        .coef-badge {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* خانات إدخال النقاط الحية */
        .grade-input {
            width: 85px;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #415A77;
            background-color: #0B132B;
            color: white;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .grade-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 123, 0, 0.5);
        }

        /* تلوين أسطر المواد حسب الحالة (ناجح/راسب) */
        tr.row-passed {
            background-color: rgba(57, 255, 20, 0.07);
        }
        tr.row-failed {
            background-color: rgba(255, 49, 49, 0.07);
        }

        /* خانات الادخال تتلون أيضاً */
        .input-passed { border-color: var(--success) !important; color: var(--success) !important; }
        .input-failed { border-color: var(--danger) !important; color: var(--danger) !important; }

        /* صندوق عرض المعدل الثابت في الأسفل لحساب فوري */
        .live-result-panel {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            background: linear-gradient(135deg, #0B132B 0%, #152244 100%);
            border: 2px dashed var(--accent);
            text-align: center;
        }

        .live-result-title {
            font-size: 1.1rem;
            color: #A0AEC0;
            margin-bottom: 8px;
        }

        .live-result-value {
            font-size: 2.8rem;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 25px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-reset:hover { background: var(--danger); color: #fff; }

        footer { text-align: center; padding: 20px; font-size: 0.85rem; color: #666; width: 100%; }
        footer span { color: var(--accent); font-weight: bold; }

        @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; pointer-events: none; visibility: hidden; } }
        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="intro-screen" id="introScreen">
        <h2 class="intro-title">أهلاً وسهلاً بك في موقع لحساب المعدل في الجامعة</h2>
        <p class="intro-subtitle">من قبل هيثم، كل الحقوق محفوظة ©</p>
    </div>

    <div class="main-container" id="mainContainer">
        
        <!-- الخطوة 1 -->
        <div class="step-panel" id="step1">
            <h3 class="step-title">الخطوة 1: شاو هو التخصص نتاعك 📚</h3>
            <div class="grid-options">
                <button class="option-btn" onclick="goToStep(2, 'subject', 'فيزياء')">فيزياء</button>
                <button class="option-btn" onclick="goToStep(2, 'subject', 'رياضيات')">رياضيات</button>
                <button class="option-btn" onclick="goToStep(2, 'subject', 'لغة عربية')">لغة عربية</button>
            </div>
        </div>

        <!-- الخطوة 2 -->
        <div class="step-panel" id="step2">
            <h3 class="step-title">الخطوة 2: وين راك سنة؟ 🎓</h3>
            <div class="grid-options">
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الأولى')">السنة الأولى</button>
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الثانية')">السنة الثانية</button>
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الثالثة')">السنة الثالثة</button>
            </div>
        </div>

        <!-- الخطوة 3 -->
        <div class="step-panel" id="step3">
            <h3 class="step-title">الخطوة 3: إكتب إسمك ✍️</h3>
            <input type="text" id="userNameInput" class="name-input" placeholder="اكتب اسمك هنا..." autocomplete="off">
            <button class="option-btn" style="background: var(--primary); color: #0B132B; width: 100%;" onclick="finishSteps()">دخول إلى لوحة التحكم الحية ⚡</button>
        </div>

        <!-- لوحة التحكم الاحترافية (نفس سيستم وحساب الموقع تماماً) -->
        <div class="step-panel" id="mainDashboard">
            
            <div class="dashboard-header">
                <div class="year-navigation">
                    <button class="year-btn" id="ybtn1" onclick="selectYear(1, 'السنة الأولى')">السنة 1</button>
                    <button class="year-btn" id="ybtn2" onclick="selectYear(2, 'السنة الثانية')">السنة 2</button>
                    <button class="year-btn" id="ybtn3" onclick="selectYear(3, 'السنة الثالثة')">السنة 3</button>
                </div>
                
                <div class="semester-navigation">
                    <button class="sem-btn active" id="sbtn1" onclick="selectSemester(1)">السداسي الأول (S1)</button>
                    <button class="sem-btn" id="sbtn2" onclick="selectSemester(2)">السداسي الثاني (S2)</button>
                </div>
            </div>

            <div class="user-welcome-tag" id="userWelcomeMessage">مرحباً</div>
            <div class="info-tag" id="currentSelectionDisplay">جامعة مستغانم</div>

            <!-- 📊 الجدول الثابت للمواد (يتغير محتواه تلقائياً حسب السداسي والتخصص) -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>المادة</th>
                            <th>المعامل</th>
                            <th>الامتحان (60%)</th>
                            <th>الأعمال TD (40%)</th>
                        </tr>
                    </thead>
                    <tbody id="subjectsTableBody">
                        <!-- الخلايا تنزل برمجياً هنا بناءً على تخصص السداسي المختار -->
                    </tbody>
                </table>
            </div>

            <!-- 👑 لوحة عرض النتيجة وحسابها فوري تلقائي بدون أزرار -->
            <div class="live-result-panel">
                <div class="live-result-title" id="liveStatusText">المعدل العام للسداسي الحالي</div>
                <div class="live-result-value" id="liveAverageValue">00.00</div>
            </div>

            <button class="btn-reset" onclick="clearSavedData()">🔄 تغيير التخصص أو الإسم</button>
        </div>

    </div>

    <footer>
        <span>هيثم</span>. كل الحقوق محفوظة © 2026
    </footer>

    <script>
        let selectedSubject = "";
        let selectedYearName = "";
        let currentSemester = 1;
        let username = "";

        // 📚 بنك المواد والمعاملات الثابتة الجاهزة لكل تخصص وسنة وسداسي (مثل الموقع)
        const staticSubjectsDatabase = {
            "فيزياء": {
                "السنة الأولى": {
                    1: [ {name: "ميكانيك نقطة مادية", coef: 3}, {name: "ترموديناميك", coef: 3}, {name: "رياضيات 1", coef: 2}, {name: "كيمياء 1", coef: 2}, {name: "إعلام آلي 1", coef: 1}, {name: "لغة أجنبية", coef: 1} ],
                    2: [ {name: "كهرباء ساكنة", coef: 3}, {name: "بنية المادة", coef: 3}, {name: "رياضيات 2", coef: 2}, {name: "كيمياء 2", coef: 2}, {name: "إعلام آلي 2", coef: 1}, {name: "تاريخ العلوم", coef: 1} ]
                },
                "السنة الثانية": {
                    1: [ {name: "ميكانيك عقلاني", coef: 3}, {name: "اهتزازات وامواج", coef: 3}, {name: "رياضيات 3", coef: 2}, {name: "بصريات هندسية", coef: 2}, {name: "إنجليزية تقنية", coef: 1} ],
                    2: [ {name: "ميكانيك الكم", coef: 3}, {name: "ديناميك حرارية 2", coef: 3}, {name: "فيزياء إحصائية", coef: 2}, {name: "الكترونيك", coef: 2}, {name: "أخلاقيات المهنة", coef: 1} ]
                }
            },
            "رياضيات": {
                "السنة الأولى": {
                    1: [ {name: "تحليل رياضيات 1", coef: 4}, {name: "جبر 1", coef: 3}, {name: "خوارزميات 1", coef: 2}, {name: "فيزياء 1", coef: 2}, {name: "إنجليزية", coef: 1} ],
                    2: [ {name: "تحليل رياضيات 2", coef: 4}, {name: "جبر 2", coef: 3}, {name: "خوارزميات 2", coef: 2}, {name: "فيزياء 2", coef: 2}, {name: "إحصاء وصفي", coef: 1} ]
                }
            },
            "لغة عربية": {
                "السنة الأولى": {
                    1: [ {name: "النحو العربي", coef: 3}, {name: "الأدب الجاهلي", coef: 3}, {name: "البلاغة", coef: 2}, {name: "علم اللسانيات", coef: 2}, {name: "لغة فرنسية", coef: 1} ],
                    2: [ {name: "الصرف العربي", coef: 3}, {name: "الأدب الإسلامي", coef: 3}, {name: "العروض والقافية", coef: 2}, {name: "نقد أدبي قديم", coef: 2}, {name: "إعلام آلي", coef: 1} ]
                }
            }
        };

        window.onload = function() {
            const savedName = localStorage.getItem('uni_username');
            const savedSubject = localStorage.getItem('uni_subject');
            const savedYear = localStorage.getItem('uni_year');

            const intro = document.getElementById('introScreen');
            const container = document.getElementById('mainContainer');

            if (savedName && savedSubject && savedYear) {
                username = savedName;
                selectedSubject = savedSubject;
                selectedYearName = savedYear;

                setTimeout(() => {
                    intro.classList.add('fade-out');
                    container.style.display = 'block';
                    container.style.animation = 'fadeInBody 1s ease-in-out forwards';
                    document.getElementById('mainDashboard').classList.add('active');
                    document.getElementById('userWelcomeMessage').innerText = "لوحة حساب النقاط الحية الخاصة بك يا " + username;
                    activateYearButton(selectedYearName);
                }, 2000);
            } else {
                setTimeout(() => {
                    intro.classList.add('fade-out');
                    container.style.display = 'block';
                    container.style.animation = 'fadeInBody 1s ease-in-out forwards';
                    document.getElementById('step1').classList.add('active');
                }, 2500);
            }
        }

        function goToStep(nextStepId, key, value) {
            if(key === 'subject') selectedSubject = value;
            if(key === 'startYear') selectedYearName = value;

            document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById('step' + nextStepId).classList.add('active');
        }

        function finishSteps() {
            let nameInput = document.getElementById('userNameInput').value.trim();
            if(nameInput === "") {
                alert("من فضلك اكتب اسمك ! 😉");
                return;
            }
            username = nameInput;

            localStorage.setItem('uni_username', username);
            localStorage.setItem('uni_subject', selectedSubject);
            localStorage.setItem('uni_year', selectedYearName);

            document.getElementById('step3').classList.remove('active');
            document.getElementById('mainDashboard').classList.add('active');
            document.getElementById('userWelcomeMessage').innerText = "لوحة حساب النقاط الحية الخاصة بك يا " + username;
            activateYearButton(selectedYearName);
        }

        function activateYearButton(yearName) {
            let indexToActive = 1;
            if(yearName.includes("الأولى")) indexToActive = 1;
            if(yearName.includes("الثانية")) indexToActive = 2;
            if(yearName.includes("الثالثة")) indexToActive = 3;
            selectYear(indexToActive, yearName);
        }

        function selectYear(yearNumber, yearText) {
            document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
            let targetBtn = document.getElementById('ybtn' + yearNumber);
            if(targetBtn) targetBtn.classList.add('active');
            
            selectedYearName = yearText;
            updateDashboardView();
        }

        function selectSemester(semNumber) {
            document.querySelectorAll('.sem-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('sbtn' + semNumber).classList.add('active');
            currentSemester = semNumber;
            updateDashboardView();
        }

        function updateDashboardView() {
            document.getElementById('currentSelectionDisplay').innerText = `جامعة مستغانم | التخصص: ${selectedSubject} | ${selectedYearName} | السداسي ${currentSemester}`;
            generateStaticTableRows();
        }

        // بناء الجدول بالمواد الثابتة وحساب فوري تلقائي
        function generateStaticTableRows() {
            let tbody = document.getElementById('subjectsTableBody');
            tbody.innerHTML = "";

            // جلب قائمة المواد من قاعدة البيانات بناء على الاختيارات الحالية
            let subjectsList = [];
            if(staticSubjectsDatabase[selectedSubject] && staticSubjectsDatabase[selectedSubject][selectedYearName]) {
                subjectsList = staticSubjectsDatabase[selectedSubject][selectedYearName][currentSemester] || [];
            }

            if(subjectsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #aaa; padding: 20px;">المواد غير متوفرة لهذا السداسي حالياً، سيتم إضافتها لاحقاً.</td></tr>`;
                calculateLiveAverage();
                return;
            }

            subjectsList.forEach((sub, index) => {
                let tr = document.createElement('tr');
                tr.id = `row-${index}`;
                
                tr.innerHTML = `
                    <td class="subject-title">${sub.name}</td>
                    <td class="coef-badge" data-coef="${sub.coef}">${sub.coef}</td>
                    <td><input type="number" class="grade-input exam-in" min="0" max="20" step="0.01" placeholder="00.00" oninput="handleLiveInputChange(this, ${index})"></td>
                    <td><input type="number" class="grade-input td-in" min="0" max="20" step="0.01" placeholder="00.00" oninput="handleLiveInputChange(this, ${index})"></td>
                `;
                tbody.appendChild(tr);
            });

            calculateLiveAverage();
        }

        // دالة المراقبة اللحظية عند الكتابة في الخانات
        function handleLiveInputChange(input, rowIndex) {
            let val = parseFloat(input.value);
            
            // تحقق من حدود النقاط وتلوين الخانات الفردية
            if (isNaN(val) || input.value === "") {
                input.className = "grade-input";
            } else {
                if (val >= 10) { input.className = "grade-input input-passed"; } 
                else { input.className = "grade-input input-failed"; }
            }

            // تلوين السطر بأكمله حسب معدل المادة الفردية الحالي
            let row = document.getElementById(`row-${rowIndex}`);
            let examVal = parseFloat(row.querySelector('.exam-in').value);
            let tdVal = parseFloat(row.querySelector('.td-in').value);

            if(!isNaN(examVal) || !isNaN(tdVal)) {
                let e = isNaN(examVal) ? 0 : examVal;
                let t = isNaN(tdVal) ? 0 : tdVal;
                
                // حساب معدل المادة الفردي (60% امتحان و 40% للأعمال الموجهة)
                let subAvg = 0;
                if(!isNaN(examVal) && !isNaN(tdVal)) subAvg = (e * 0.6) + (t * 0.4);
                else if(!isNaN(examVal)) subAvg = examVal;
                else subAvg = tdVal;

                if(subAvg >= 10) {
                    row.className = "row-passed";
                } else {
                    row.className = "row-failed";
                }
            } else {
                row.className = "";
            }

            // استدعاء الحساب التلقائي اللحظي للمعدل الفصلي العام
            calculateLiveAverage();
        }

        // 👑 دالة الحساب الفوري اللحظي للمعدل العام بدون الضغط على أي زر
        function calculateLiveAverage() {
            let rows = document.querySelectorAll('#subjectsTableBody tr');
            let totalWeightedGrades = 0;
            let totalCoefficients = 0;
            let hasAnyValidInput = false;

            rows.forEach(row => {
                let coefElem = row.querySelector('.coef-badge');
                if(!coefElem) return;

                let coef = parseFloat(coefElem.getAttribute('data-coef'));
                let examVal = parseFloat(row.querySelector('.exam-in').value);
                let tdVal = parseFloat(row.querySelector('.td-in').value);

                let subjectAverage = 0;
                let hasValidData = false;

                if (!isNaN(examVal) && !isNaN(tdVal)) {
                    subjectAverage = (examVal * 0.6) + (tdVal * 0.4);
                    hasValidData = true;
                } else if (!isNaN(examVal) && isNaN(tdVal)) {
                    subjectAverage = examVal;
                    hasValidData = true;
                } else if (isNaN(examVal) && !isNaN(tdVal)) {
                    subjectAverage = tdVal;
                    hasValidData = true;
                }

                if (hasValidData) {
                    totalWeightedGrades += (subjectAverage * coef);
                    totalCoefficients += coef;
                    hasAnyValidInput = true;
                }
            });

            let liveAvgElem = document.getElementById('liveAverageValue');
            let liveStatusElem = document.getElementById('liveStatusText');

            if (!hasAnyValidInput || totalCoefficients === 0) {
                liveAvgElem.innerText = "00.00";
                liveAvgElem.style.color = "#FFFFFF";
                liveStatusElem.innerHTML = "المعدل العام للسداسي الحالي (اكتب النقاط ليظهر الحساب فوراً):";
                return;
            }

            let finalAvg = totalWeightedGrades / totalCoefficients;
            liveAvgElem.innerText = finalAvg.toFixed(2);

            if (finalAvg >= 10) {
                liveAvgElem.style.color = "var(--success)";
                liveStatusElem.innerHTML = "🎉 مبروك! السداسي مستوفى بنجاح:";
            } else {
                liveAvgElem.style.color = "var(--danger)";
                liveStatusElem.innerHTML = "⚠️ المعدل الحالي دون الـ 10 (بالتوفيق في الاستدراك):";
            }
        }

        function clearSavedData() {
            if(confirm("هل راك متأكد بلي حاب تبدل الاسم والتخصص؟")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
