<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة HYDRA-AI السيبرانية الذكية | نسخة هيثم</title>
    <style>
        :root {
            --bg-dark: #050814;
            --panel-bg: #0B0F19;
            --primary-neon: #FF7B00;
            --accent-gold: #FFD700;
            --text-white: #FFFFFF;
            --neon-green: #39FF14;
            --neon-red: #FF3131;
            --chat-user: #1E293B;
            --chat-ai: #111827;
            --border-color: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        /* الهيدر الاحترافي المتوهج */
        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .main-title {
            font-size: 1.8rem;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--primary-neon);
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* حاوية الشات الرئيسية بنفس التصميم */
        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            border-radius: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.4s ease;
        }

        .chat-container:hover {
            border-color: var(--primary-neon);
        }

        /* شاشة عرض الرسائل */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: radial-gradient(rgba(255, 123, 0, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* ستايل الرسائل النيون */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--chat-user);
            color: #FFF;
            border-top-left-radius: 2px;
            border-left: 3px solid var(--accent-gold);
        }

        .message.ai {
            align-self: flex-end;
            background-color: var(--chat-ai);
            color: #E2E8F0;
            border-top-right-radius: 2px;
            border-right: 3px solid var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        /* ستايل خاص بالأكواد داخل الشات */
        pre {
            background: #060B16;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            color: var(--neon-green);
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        /* منطقة الإدخال */
        .input-area {
            padding: 15px;
            background: #060A12;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: var(--bg-dark);
            color: #FFF;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-box:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.2);
        }

        .send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary-neon) 0%, #CC6200 100%);
            border: none;
            color: var(--bg-dark);
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 123, 0, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 123, 0, 0.5);
        }

        /* أنيميشن التحميل الخاص بالذكاء الاصطناعي */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 5px 10px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--primary-neon);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* تخصيص السكرول بار ليناسب الهكرز */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-neon); }

    </style>
</head>
<body>

    <header>
        <h1 class="main-title">HYDRA//_AI CORE</h1>
        <p class="subtitle">الذكاء الاصطناعي الهجين المطور بواسطة القائد هيثم ⚡</p>
    </header>

    <div class="chat-container">
        <!-- شاشة الشات الحية -->
        <div class="chat-box" id="chatBox">
            <div class="message ai">
                [نظام HYDRA_AI جاهز للعمل] مرحبا بك يا كابتن هيثم. أنا مساعدك السيبراني الذكي مدمج بأحدث خوارزميات الاستجابة اللحظية. اسألني عن الأكواد، السكريبتات، الأمن السيبراني، أو الفيزياء والرياضيات! 🤖🔥
            </div>
        </div>

        <!-- خانة الإرسال والتحكم -->
        <div class="input-area">
            <input type="text" id="userInput" class="input-box" placeholder="اكتب أمرك هنا، أو اطلب سكريبت (مثال: اصنع سكريبت python)..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">تنفيذ الأمر</button>
        </div>
    </div>

    <script>
        // 🧠 خوارزمية محرك النطق والاستجابة الذكية المبنية محلياً (Cyber Logic Engine)
        const aiKnowledgeBase = [
            {
                keywords: ["سلام", "مرحبا", "اهلين", "الو"],
                response: "أهلاً بك يا زعيم! نظام HYDRA تحت أمرك بالكامل. واش هي المهمة السيبرانية أو البرمجية اللي حاب ننفذوها اليوم؟ 💻⚔️"
            },
            {
                keywords: ["python", "بايثون", "سكريبت python", "سكريبت بايثون"],
                response: "أبشر! هاهو سكريبت Python ذكي ومرعب لعمل Scanner وفحص المنافذ (Port Scanner) بشكل سريع وخفيف:\n<pre>import socket\n\ntarget = '127.0.0.1'\nports = [21, 22, 80, 443]\n\nfor port in ports:\n    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n    s.settimeout(1)\n    result = s.connect_ex((target, port))\n    if result == 0:\n        print(f'[+] Port {port} is OPEN!')\n    s.close()</pre>\nتقدر تطوره كيما تحب وتضيف عليه Proxychains!"
            },
            {
                keywords: ["batch", "باتش", "سكريبت باتش", "batch script"],
                response: "مفهوم! إليك سكريبت Batch (.bat) احترافي لتنظيف مخلفات الويندوز والـ Cache لتسريع الـ RAM والكمبيوتر في ثانية واحدة:\n<pre>@echo off\ntitle Cyber Cleaner Pro\necho [+] Cleaning Windows Temporary Files...\ndel /f /q /s %systemdrive%\\*.tmp\ndel /f /q /s %windir%\\temp\\*.*\nrd /s /q %windir%\\temp & md %windir%\\temp\necho [+] RAM and System Cleaned successfully!\npause</pre>\nشغلو كمسؤول (Run as Admin) وشوف السرعة!"
            },
            {
                keywords: ["kali", "كالي", "لينكس", "linux", "اختراق"],
                response: "العمل على Kali Linux يتطلب الحذر والذكاء الأخلاقي دائماً! 🛡️ أهم الأوامر اللي لازم تكون حافظها في التيرمينال نتاعك:\n1. `sudo apt update && sudo apt upgrade` لتحديث أدواتك.\n2. `proxychains firefox` لتصفح مخفي بالكامل عبر شبكة Tor الآمنة.\n3. `ifconfig` أو `ip a` لفحص كرت الشبكة وإعدادات الـ IP."
            },
            {
                keywords: ["فيزياء", "رياضيات", "ميكانيك", "معدل", "احسب"],
                response: "مرحباً بك في عالم العلوم الصلبة! 📐🧠 إذا عندك أي معادلة ميكانيكية، حساب أشعة، أو حساب طاقة حركية، حطها هنا والمحرك الذكي راح يفككها لك ويحسبهالك تم تم بقوانين الفيزياء الصارمة!"
            },
            {
                keywords: ["شكون انت", "من انت", "اسمك"],
                response: "أنا HYDRA-AI، الذكاء الاصطناعي الملوكي الهجين المصمم بواجهة النيون المتطورة بناءً على التحدي اللي أطلقه المبرمج البطل هيثم! 👑🔥"
            }
        ];

        // دالة الإرسال ومعالجة النصوص
        function sendMessage() {
            const inputField = document.getElementById("userInput");
            const query = inputField.value.trim();
            if (query === "") return;

            // 1. عرض رسالة المستخدم في الشات
            appendMessage(query, "user");
            inputField.value = "";

            // 2. إظهار تأثير التحميل (الذكاء الاصطناعي يفكر)
            const chatBox = document.getElementById("chatBox");
            const typingDiv = document.createElement("div");
            typingDiv.className = "message ai typing-id";
            typingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. معالجة الرد الذكي مع تأخير واقعي محاكي للبشر
            setTimeout(() => {
                typingDiv.remove(); // حذف أنيميشن التحميل
                let reply = generateSmartResponse(query);
                appendMessage(reply, "ai");
            }, 1000);
        }

        // دالة التوليد والبحث الذكي في قاعدة البيانات السيبرانية
        function generateSmartResponse(userText) {
            let textLower = userText.toLowerCase();
            
            // البحث عن تطابق الكلمات المفتاحية
            for (let item of aiKnowledgeBase) {
                for (let key of item.keywords) {
                    if (textLower.includes(key)) {
                        return item.response;
                    }
                }
            }

            // رد افتراضي ذكي إذا لم يجد كلمة مفتاحية معينة (خوارزمية المحلل المفتوح)
            return "🎯 أمر مثير للاهتمام يا كابتن هيثم! تم استلام رسالتك وفهمها داخل نظام HYDRA-AI. لمزيد من الدقة، هل تقصد برمجة سكريبت مخصص لها، أم تريد شرحاً سيبرانياً معمقاً حول هذه النقطة؟ نورني بشطارتك!";
        }

        // دالة إضافة الرسالة للشاشة مع تأثير الكتابة التلقائية الحية
        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;

            if (sender === "ai") {
                // إذا كان الرد من الذكاء الاصطناعي ويحتوي على كود، نعرضه مباشرة، وإلا نقوم بتأثير الكتابة الحية
                if (text.includes("<pre>")) {
                    msgDiv.innerHTML = text;
                    chatBox.appendChild(msgDiv);
                } else {
                    chatBox.appendChild(msgDiv);
                    let i = 0;
                    // تأثير الكتابة اللحظي كأنو هاكر يكتب
                    function typeWriter() {
                        if (i < text.length) {
                            msgDiv.innerHTML += text.charAt(i);
                            i++;
                            chatBox.scrollTop = chatBox.scrollHeight;
                            setTimeout(typeWriter, 15);
                        }
                    }
                    typeWriter();
                }
            } else {
                msgDiv.innerText = text;
                chatBox.appendChild(msgDiv);
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
