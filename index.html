<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدراسة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(15, 23, 42, 0.9);
            --primary-gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.3);
            --light-blue: #38bdf8; /* لون أزرق فاتح موحد */
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; transition: all 0.3s ease; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px 10px; position: relative; overflow-x: hidden;
        }

        /* خلفية أشكال متحرّكة عائمة */
        .bg-shapes {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            overflow: hidden;
        }
        .shape { position: absolute; opacity: 0.2; animation: floatAnim 18s infinite ease-in-out alternate; }
        .shape-circle { border-radius: 50%; border: 2px solid var(--primary-gold); }
        .shape-square { border: 2px solid var(--light-blue); transform: rotate(45deg); }
        .s1 { top: 10%; left: 10%; width: 50px; height: 50px; }
        .s2 { top: 70%; left: 80%; width: 70px; height: 70px; }
        .s3 { top: 30%; left: 85%; width: 40px; height: 40px; }

        @keyframes floatAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(40px, 50px) rotate(180deg); }
        }

        .glow-box {
            background: var(--bg-card);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 16px; padding: 20px; backdrop-filter: blur(10px);
        }

        .step-card { width: 90%; max-width: 500px; text-align: center; }

        .avatar-container { position: relative; width: 80px; height: 80px; margin: 0 auto 15px; }
        .avatar-box {
            width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--primary-gold); background: #1e293b;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload-btn {
            position: absolute; bottom: 0; right: 0; background: var(--primary-gold);
            color: #000; width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        input[type="text"], input[type="number"], select {
            width: 100%; padding: 10px; border-radius: 8px;
            background: #090d16; border: 1px solid var(--light-blue); color: #fff;
            margin-bottom: 12px; text-align: center;
        }

        .btn {
            background: var(--primary-gold); color: #000; border: none; padding: 8px 18px;
            font-weight: bold; border-radius: 8px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; justify-content: center;
        }
        .btn-secondary { background: transparent; border: 1px solid var(--light-blue); color: #fff; }

        #mainDashboard { display: none; width: 95%; max-width: 1000px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

        /* التايمر الدائري المتناقص */
        .circle-timer-wrapper { position: relative; width: 180px; height: 180px; margin: 15px auto; }
        .circle-timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: #090d16; stroke-width: 8; }
        .circle-progress {
            fill: none; stroke: var(--primary-gold); stroke-width: 8; stroke-linecap: round;
            stroke-dasharray: 534; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear;
        }
        .timer-display-inner {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: bold; color: #fff;
        }

        /* 🌟 شريط التقدم بالأزرق الفاتح والكتابة بداخل المستطيل 🌟 */
        .progress-bar-outer {
            position: relative;
            background: #090d16;
            height: 32px; /* كبرنا الارتفاع لتسبيبت الكتابة بداخلها */
            border-radius: 10px;
            border: 1px solid var(--light-blue);
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background-color: var(--light-blue); /* أزرق فاتح موحد */
            transition: width 0.4s ease;
        }

        .progress-text-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 0 0 4px #000; /* لضمان وضوح الخط فوق الأزرق */
            pointer-events: none;
        }

        .account-card {
            background: #090d16; border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .goals-list { list-style: none; max-height: 180px; overflow-y: auto; }
        .goal-item { background: #090d16; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .goal-item.completed span { text-decoration: line-through; opacity: 0.5; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--primary-gold); border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-circle s1"></div>
        <div class="shape shape-square s2"></div>
        <div class="shape shape-circle s3"></div>
    </div>

    <!-- قائمة الحسابات -->
    <div id="accountsScreen" class="glow-box step-card" style="display: none;">
        <h2><i class="fa-solid fa-users"></i> اختر حسابك</h2>
        <br>
        <div id="accountsList"></div>
        <button class="btn" onclick="showAccountForm()"><i class="fa-solid fa-user-plus"></i> إضافة حساب جديد</button>
    </div>

    <!-- نموذج إنشاء / تعديل الحساب -->
    <div id="accountFormScreen" class="glow-box step-card" style="display: none;">
        <h2 id="formTitle"><i class="fa-solid fa-user-pen"></i> إدارة الحساب</h2>
        <br>
        <div class="avatar-container">
            <div class="avatar-box" id="avatarPreviewBox">
                <i class="fa-solid fa-user" style="font-size: 35px; color: var(--primary-gold);"></i>
            </div>
            <label class="avatar-upload-btn">
                <i class="fa-solid fa-camera"></i>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </label>
        </div>
        <input type="text" id="userNameInput" placeholder="أدخل اسمك...">
        <select id="userLevelInput">
            <option value="الابتدائي">المستوى الابتدائي</option>
            <option value="المتوسط">المستوى المتوسط</option>
            <option value="الثانوي">المستوى الثانوي</option>
            <option value="الجامعة">المرحلة الجامعية</option>
        </select>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-secondary" onclick="showAccountsScreen()">إلغاء</button>
            <button class="btn" onclick="saveAccountData()">حفظ</button>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="mainDashboard">
        <div class="glow-box dashboard-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="avatar-container" style="width: 45px; height: 45px; margin: 0;">
                    <div class="avatar-box" id="dashAvatarBox"></div>
                </div>
                <div>
                    <h3 id="dashUserName" style="margin:0; font-size: 1rem;">الاسم</h3>
                    <span id="dashUserLevel" style="color: var(--text-muted); font-size: 0.8rem;">المستوى</span>
                </div>
            </div>
            <button class="btn btn-secondary" style="font-size: 0.8rem;" onclick="switchAccount()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> تبديل الحساب
            </button>
        </div>

        <div class="grid-layout">
            <!-- المؤقت -->
            <div class="glow-box" style="text-align: center;">
                <h3><i class="fa-solid fa-clock"></i> المؤقت الذهبي</h3>
                <div class="circle-timer-wrapper">
                    <svg class="circle-timer-svg">
                        <circle class="circle-bg" cx="90" cy="90" r="85"></circle>
                        <circle class="circle-progress" id="circleProgress" cx="90" cy="90" r="85"></circle>
                    </svg>
                    <div class="timer-display-inner" id="timerDisplay">25:00</div>
                </div>
                <div id="timerControls">
                    <input type="number" id="customMins" value="25" min="1" style="width: 80px; padding: 4px;"> دقيقة
                    <br><br>
                    <button class="btn" id="startBtn" onclick="startTimer()"><i class="fa-solid fa-play"></i> ابدأ</button>
                    <button class="btn btn-secondary" id="stopBtn" onclick="resetTimer()" style="display:none;">إيقاف</button>
                </div>
            </div>

            <!-- الأهداف والشريط المعدل -->
            <div class="glow-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3><i class="fa-solid fa-bullseye"></i> الأهداف اليومية</h3>
                    <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="openGoalModal()">+ إضافة</button>
                </div>

                <!-- 🌟 المستطيل بالأزرق الفاتح مع الكتابة بداخلها 🌟 -->
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="progressBarFill"></div>
                    <div class="progress-text-overlay">
                        <span id="progressText">0 / 0 مكتمل</span>
                        <span id="progressPercent">0%</span>
                    </div>
                </div>

                <ul class="goals-list" id="goalsList"></ul>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة هدف -->
    <div class="modal" id="goalModal">
        <div class="modal-content">
            <h3>إضافة هدف جديد</h3><br>
            <input type="text" id="goalInput" placeholder="اكتب الهدف...">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeGoalModal()">إلغاء</button>
                <button class="btn" onclick="addGoal()">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        let accounts = JSON.parse(localStorage.getItem('study_accounts') || '[]');
        let activeIndex = null;
        let editingIndex = null;
        let tempAvatar = '';
        let timerInterval = null;
        let totalSeconds = 0, initialSeconds = 0;
        const maxCircleOffset = 534;

        window.onload = function() {
            if (accounts.length === 0) showAccountForm();
            else showAccountsScreen();
        };

        function saveToStorage() { localStorage.setItem('study_accounts', JSON.stringify(accounts)); }

        function showAccountsScreen() {
            hideScreens();
            document.getElementById('accountsScreen').style.display = 'block';
            const list = document.getElementById('accountsList');
            list.innerHTML = '';

            accounts.forEach((acc, idx) => {
                list.innerHTML += `
                    <div class="account-card">
                        <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="selectAccount(${idx})">
                            <div class="avatar-box" style="width:35px; height:35px;">
                                ${acc.avatar ? `<img src="${acc.avatar}">` : `<i class="fa-solid fa-user" style="color:var(--primary-gold);"></i>`}
                            </div>
                            <div style="text-align:right;">
                                <strong>${acc.name}</strong><br>
                                <small style="color:var(--text-muted);">${acc.level}</small>
                            </div>
                        </div>
                        <!-- 🌟 أيقونة القلم لتعديل الحساب 🌟 -->
                        <i class="fa-solid fa-pen-to-square" style="color:var(--primary-gold); cursor:pointer; font-size:1.1rem;" title="تعديل الحساب" onclick="editAccount(${idx})"></i>
                    </div>
                `;
            });
        }

        function showAccountForm(isEdit = false) {
            hideScreens();
            document.getElementById('accountFormScreen').style.display = 'block';
            if (!isEdit) {
                editingIndex = null;
                tempAvatar = '';
                document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-user-plus"></i> إضافة حساب جديد';
                document.getElementById('userNameInput').value = '';
                document.getElementById('avatarPreviewBox').innerHTML = `<i class="fa-solid fa-user" style="font-size:35px; color:var(--primary-gold);"></i>`;
            }
        }

        function editAccount(idx) {
            editingIndex = idx;
            const acc = accounts[idx];
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen"></i> تعديل بيانات الحساب';
            document.getElementById('userNameInput').value = acc.name;
            document.getElementById('userLevelInput').value = acc.level;
            tempAvatar = acc.avatar || '';
            document.getElementById('avatarPreviewBox').innerHTML = tempAvatar ? `<img src="${tempAvatar}">` : `<i class="fa-solid fa-user" style="font-size:35px; color:var(--primary-gold);"></i>`;
            showAccountForm(true);
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    tempAvatar = evt.target.result;
                    document.getElementById('avatarPreviewBox').innerHTML = `<img src="${tempAvatar}">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveAccountData() {
            const name = document.getElementById('userNameInput').value.trim();
            const level = document.getElementById('userLevelInput').value;
            if (!name) return alert('يرجى كتابة الاسم');

            if (editingIndex !== null) {
                accounts[editingIndex].name = name;
                accounts[editingIndex].level = level;
                accounts[editingIndex].avatar = tempAvatar;
            } else {
                accounts.push({ name, level, avatar: tempAvatar, goals: [] });
            }
            saveToStorage();
            showAccountsScreen();
        }

        function selectAccount(idx) {
            activeIndex = idx;
            enterDashboard();
        }

        function enterDashboard() {
            hideScreens();
            document.getElementById('mainDashboard').style.display = 'block';
            const acc = accounts[activeIndex];
            document.getElementById('dashUserName').innerText = acc.name;
            document.getElementById('dashUserLevel').innerText = acc.level;
            document.getElementById('dashAvatarBox').innerHTML = acc.avatar ? `<img src="${acc.avatar}">` : `<i class="fa-solid fa-user" style="color:var(--primary-gold);"></i>`;
            renderGoals();
        }

        function switchAccount() { resetTimer(); showAccountsScreen(); }
        function hideScreens() {
            document.getElementById('accountsScreen').style.display = 'none';
            document.getElementById('accountFormScreen').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'none';
        }

        /* 🌟 المؤقت ودائرة الذهب المتناقصة 🌟 */
        function startTimer() {
            const mins = parseInt(document.getElementById('customMins').value);
            if (!mins || mins < 1) return;
            totalSeconds = mins * 60;
            initialSeconds = totalSeconds;

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-flex';

            timerInterval = setInterval(() => {
                totalSeconds--;
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                document.getElementById('timerDisplay').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

                // تصغير وتناقص حلقة الدائرة الذهب مع مرور الوقت
                const offset = maxCircleOffset * (1 - (totalSeconds / initialSeconds));
                document.getElementById('circleProgress').style.strokeDashoffset = offset;

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("انتهى وقت المؤقت!");
                    resetTimer();
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('timerDisplay').innerText = "25:00";
            document.getElementById('circleProgress').style.strokeDashoffset = 0;
        }

        /* الأهداف */
        function openGoalModal() { document.getElementById('goalModal').style.display = 'flex'; }
        function closeGoalModal() { document.getElementById('goalModal').style.display = 'none'; document.getElementById('goalInput').value = ''; }

        function addGoal() {
            const text = document.getElementById('goalInput').value.trim();
            if(!text) return;
            accounts[activeIndex].goals.push({ id: Date.now(), text, completed: false });
            saveToStorage(); renderGoals(); closeGoalModal();
        }

        function toggleGoal(id) {
            const goal = accounts[activeIndex].goals.find(g => g.id === id);
            if (goal) goal.completed = !goal.completed;
            saveToStorage(); renderGoals();
        }

        function deleteGoal(id) {
            accounts[activeIndex].goals = accounts[activeIndex].goals.filter(g => g.id !== id);
            saveToStorage(); renderGoals();
        }

        function renderGoals() {
            const list = document.getElementById('goalsList');
            list.innerHTML = '';
            const goals = accounts[activeIndex].goals || [];
            const completedCount = goals.filter(g => g.completed).length;

            goals.forEach(g => {
                list.innerHTML += `
                    <li class="goal-item ${g.completed ? 'completed' : ''}">
                        <span>${g.text}</span>
                        <div>
                            <i class="fa-solid fa-check" style="color:var(--primary-gold); cursor:pointer; margin-left:8px;" onclick="toggleGoal(${g.id})"></i>
                            <i class="fa-solid fa-trash" style="color:#ef4444; cursor:pointer;" onclick="deleteGoal(${g.id})"></i>
                        </div>
                    </li>
                `;
            });

            const percent = goals.length === 0 ? 0 : Math.round((completedCount / goals.length) * 100);
            
            /* تحديث التعبئة والنص بالداخل */
            document.getElementById('progressBarFill').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${completedCount} / ${goals.length} مكتمل`;
            document.getElementById('progressPercent').innerText = `${percent}%`;
        }
    </script>
</body>
</html>
