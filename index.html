<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع العالمي لحساب المعدل الجامعي</title>
    <style>
        /* نظام الألوان الفخم المعتمد */
        :root {
            --bg-color: #0B132B; 
            --card-bg: #1C2541; 
            --primary: #FF7B00; 
            --accent: #FFD700;  
            --text-main: #FFFFFF;
            --success: #39FF14; 
            --danger: #FF3131;  
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 🌟 شاشة الترحيب الخرافية عند الدخول */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1c2541 0%, #0b132b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .fade-out {
            animation: fadeOut 1.5s ease-in-out forwards;
        }

        .intro-title {
            font-size: 2.3rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 15px;
            text-align: center;
        }

        .intro-subtitle {
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* 🏢 حاوية المراحل والموقع الرئيسية */
        .main-container {
            width: 90%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px; 
            border: 2px solid var(--accent); 
            box-shadow: 0 0 30px rgba(255, 123, 0, 0.2);
            margin: 40px 0;
            display: none; /* يتم إظهاره بالـ JS بعد شاشة الترحيب */
        }

        /* أنماط الواجهات التفاعلية (المراحل) */
        .step-panel {
            display: none; 
            text-align: center;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .step-panel.active {
            display: block; 
        }

        .step-title {
            color: var(--accent);
            margin-bottom: 25px;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* أزرار اختيار المواد والسنوات في المراحل */
        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }

        .option-btn {
            padding: 15px;
            background: #0B132B;
            border: 2px solid #415A77;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.3);
            transform: scale(1.02);
        }

        /* خانة إدخال الاسم الفخمة */
        .name-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #415A77;
            background-color: #0B132B;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.4s ease;
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        /* 🗺️ شريط أزرار السنوات في الواجهة الرئيسية */
        .year-navigation {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 25px;
            background: #0B132B;
            padding: 8px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .year-btn {
            flex: 1;
            padding: 10px 5px;
            background: transparent;
            border: none;
            color: #A0AEC0;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .year-btn.active {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: #0B132B;
            box-shadow: 0 0 12px var(--primary);
        }

        /* رسالة الترحيب المخصصة للمستخدم بالداخل */
        .user-welcome-tag {
            text-align: center;
            color: var(--accent);
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .university-tag {
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 25px;
            font-size: 1.1rem;
            background: rgba(255, 123, 0, 0.1);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--primary);
        }

        .subject-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        label {
            font-size: 1.1rem;
            color: #E0E1DD;
        }

        .input-wrapper {
            position: relative;
            width: 120px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #415A77;
            background-color: #0B132B;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.4s ease;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary), 0 0 5px var(--accent);
            transform: scale(1.05);
        }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none;
            border-radius: 15px;
            color: #0B132B;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 123, 0, 0.4);
            margin-top: 15px;
        }

        .btn-calc:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }

        /* زر إعادة ضبط البيانات لتغيير الإسم والتخصص */
        .btn-reset {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-reset:hover {
            background: var(--danger);
            color: #fff;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background: #0B132B;
            border: 1px dashed var(--accent);
            text-align: center;
            display: none;
        }

        .result-title {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px currentColor;
        }

        .above-ten { color: var(--success) !important; border-color: var(--success) !important; }
        .below-ten { color: var(--danger) !important; border-color: var(--danger) !important; }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #666;
            width: 100%;
        }

        footer span { color: var(--accent); font-weight: bold; }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; visibility: hidden; }
        }
        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- 🌟 شاشة الترحيب العالمية -->
    <div class="intro-screen" id="introScreen">
        <h2 class="intro-title">أهلاً وسهلاً بك في موقع لحساب المعدل في الجامعة</h2>
        <p class="intro-subtitle">من قبل هيثم، كل الحقوق محفوظة ©</p>
    </div>

    <!-- 🏢 الحاوية الرئيسية للموقع -->
    <div class="main-container" id="mainContainer">
        
        <!-- 🧩 المرحلة 1: اختيار المادة -->
        <div class="step-panel" id="step1">
            <h3 class="step-title">الخطوة 1: شاو هو التخصص نتاعك 📚</h3>
            <div class="grid-options">
                <button class="option-btn" onclick="goToStep(2, 'subject', 'فيزياء')">فيزياء</button>
                <button class="option-btn" onclick="goToStep(2, 'subject', 'رياضيات')">رياضيات</button>
                <button class="option-btn" onclick="goToStep(2, 'subject', 'لغة عربية')">لغة عربية</button>
            </div>
        </div>

        <!-- 🧩 المرحلة 2: اختيار السنة الدراسية كبداية -->
        <div class="step-panel" id="step2">
            <h3 class="step-title">الخطوة 2: وين راك سنة؟ 🎓</h3>
            <div class="grid-options">
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الأولى')">السنة الأولى</button>
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الثانية')">السنة الثانية</button>
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الثالثة')">السنة الثالثة</button>
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الرابعة')">السنة الرابعة</button>
                <button class="option-btn" onclick="goToStep(3, 'startYear', 'السنة الخامسة')">السنة الخامسة</button>
            </div>
        </div>

        <!-- 🧩 المرحلة 3: كتابة الاسم لطلب الهوية -->
        <div class="step-panel" id="step3">
            <h3 class="step-title">الخطوة 3: إ:تب إسمك  ✍️</h3>
            <input type="text" id="userNameInput" class="name-input" placeholder="اكتب اسمك هنا..." autocomplete="off">
            <button class="btn-calc" onclick="finishSteps()">الدخول إلى لوحة التحكم العالمية ⚡</button>
        </div>

        <!-- 👑 الواجهة الرئيسية النهائية بعد إتمام الخطوات -->
        <div class="step-panel" id="mainDashboard">
            
            <!-- 🗺️ شريط التنقل العلوي الفخم بين السنوات 1-5 -->
            <div class="year-navigation">
                <button class="year-btn" id="ybtn1" onclick="selectYear(1, 'السنة الأولى')">السنة 1</button>
                <button class="year-btn" id="ybtn2" onclick="selectYear(2, 'السنة الثانية')">السنة 2</button>
                <button class="year-btn" id="ybtn3" onclick="selectYear(3, 'السنة الثالثة')">السنة 3</button>
                <button class="year-btn" id="ybtn4" onclick="selectYear(4, 'السنة الرابعة')">السنة 4</button>
                <button class="year-btn" id="ybtn5" onclick="selectYear(5, 'السنة الخامسة')">السنة 5</button>
            </div>

            <!-- الجملة الأسطورية المخصصة للمستخدم -->
            <div class="user-welcome-tag" id="userWelcomeMessage">اكتب نتائجك يا هيثم</div>

            <!-- بطاقة عرض معلومات الاختيار الحالي -->
            <div class="university-tag" id="currentSelectionDisplay">جامعة مستغانم</div>

            <!-- خانات إدخال النقاط التجريبية اللامعة -->
            <div class="subject-row">
                <label id="lbl-mod1"> الفيزياء</label>
                <div class="input-wrapper">
                    <input type="number" class="grade-input" min="0" max="20" step="0.01" placeholder="00.00" oninput="checkColor(this)">
                </div>
            </div>

            <div class="subject-row">
                <label id="lbl-mod2">الميكانيك</label>
                <div class="input-wrapper">
                    <input type="number" class="grade-input" min="0" max="20" step="0.01" placeholder="00.00" oninput="checkColor(this)">
                </div>
            </div>

            <div class="subject-row">
                <label id="lbl-mod3">علم النفس </label>
                <div class="input-wrapper">
                    <input type="number" class="grade-input" min="0" max="20" step="0.01" placeholder="00.00" oninput="checkColor(this)">
                </div>
            </div>

            <button class="btn-calc" onclick="calculateAverage()">احسب المعدل النهائي ⚡</button>

            <!-- صندوق النتيجة السحري المتوهج -->
            <div class="result-box" id="resultBox">
                <div class="result-title" id="resultStatus">المعدل العام السداسي</div>
                <div class="result-value" id="finalAverage">00.00</div>
            </div>

            <!-- زر خروج أو مسح الذاكرة إذا حب شخص آخر يجرب الموقع -->
            <button class="btn-reset" onclick="clearSavedData()">إذا راك باغي تبدل إسمك والتخصص 🔄</button>
        </div>

    </div>

    <!-- 👑 تذييل الصفحة لحفظ الحقوق -->
    <footer>
        <span>هيثم</span>. كل الحقوق محفوظة © 2026
    </footer>

    <script {__run_in_browser__}>
        // متغيرات لتخزين خيارات المستخدم في الذاكرة
        let selectedSubject = "";
        let selectedYearName = "";
        let username = "";

        // عند تحميل الصفحة، نتحقق إذا كان المتصفح يعقل على المستخدم من قبل
        window.onload = function() {
            const savedName = localStorage.getItem('uni_username');
            const savedSubject = localStorage.getItem('uni_subject');
            const savedYear = localStorage.getItem('uni_year');

            const intro = document.getElementById('introScreen');
            const container = document.getElementById('mainContainer');

            if (savedName && savedSubject && savedYear) {
                // إذا كان مسجل من قبل، نمرر البيانات مباشرة ونفتح لوحة التحكم
                username = savedName;
                selectedSubject = savedSubject;
                selectedYearName = savedYear;

                setTimeout(() => {
                    intro.classList.add('fade-out');
                    container.style.display = 'block';
                    container.style.animation = 'fadeInBody 1s ease-in-out forwards';
                    
                    document.getElementById('mainDashboard').classList.add('active');
                    document.getElementById('userWelcomeMessage').innerText = "مادابيك تكتب نقاطك يا " + username;
                    
                    activateYearButton(selectedYearName);
                }, 2000); // عرض شاشة الترحيب لمدة ثانيتين فقط
            } else {
                // إذا كان مستخدم جديد، نبدأ بالخطوة الأولى بشكل عادي
                setTimeout(() => {
                    intro.classList.add('fade-out');
                    container.style.display = 'block';
                    container.style.animation = 'fadeInBody 1s ease-in-out forwards';
                    document.getElementById('step1').classList.add('active');
                }, 2500);
            }
        }

        // دالة سريعة للتنقل بين المراحل الثلاثة الأولى
        function goToStep(nextStepId, key, value) {
            if(key === 'subject') selectedSubject = value;
            if(key === 'startYear') selectedYearName = value;

            document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById('step' + nextStepId).classList.add('active');
        }

        // دالة إنهاء المراحل وحفظ البيانات في الـ localStorage
        function finishSteps() {
            let nameInput = document.getElementById('userNameInput').value.trim();
            if(nameInput === "") {
                alert("من فضلك اكتب اسمك ! 😉");
                return;
            }
            username = nameInput;

            // حفظ في ذاكرة المتصفح المحلية
            localStorage.setItem('uni_username', username);
            localStorage.setItem('uni_subject', selectedSubject);
            localStorage.setItem('uni_year', selectedYearName);

            document.getElementById('step3').classList.remove('active');
            document.getElementById('mainDashboard').classList.add('active');

            document.getElementById('userWelcomeMessage').innerText = "مادابيك تكتب نقاطك يا " + username;

            activateYearButton(selectedYearName);
        }

        // ميكانيزم تفعيل زر السنة تلقائياً
        function activateYearButton(yearName) {
            let indexToActive = 1;
            if(yearName.includes("الأولى")) indexToActive = 1;
            if(yearName.includes("الثانية")) indexToActive = 2;
            if(yearName.includes("الثالثة")) indexToActive = 3;
            if(yearName.includes("الرابعة")) indexToActive = 4;
            if(yearName.includes("الخامسة")) indexToActive = 5;

            selectYear(indexToActive, yearName);
        }

        // دالة التنقل الحر بين أزرار السنوات
        function selectYear(yearNumber, yearText) {
            document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('ybtn' + yearNumber).classList.add('active');
            
            document.getElementById('currentSelectionDisplay').innerText = "جامعة مستغانم - تخصص: " + selectedSubject + " (" + yearText + ")";

            document.getElementById('lbl-mod1').innerText = "مادة الـ " + selectedSubject + " ";
            document.getElementById('lbl-mod2').innerText = "مادة الـ " + selectedSubject + " ";
            document.getElementById('lbl-mod3').innerText = "علم النفس";

            let inputs = document.querySelectorAll('.grade-input');
            inputs.forEach(input => {
                input.value = "";
                input.className = "grade-input";
            });
            document.getElementById('resultBox').style.display = 'none';
        }

        // دالة تلوين النقاط فورياً أثناء الكتابة
        function checkColor(input) {
            let val = parseFloat(input.value);
            if (isNaN(val) || input.value === "") {
                input.className = "grade-input"; 
                return;
            }
            if (val >= 10) {
                input.className = "grade-input above-ten";
            } else {
                input.className = "grade-input below-ten";
            }
        }

        // دالة حساب المعدل النهائي
        function calculateAverage() {
            let inputs = document.querySelectorAll('.grade-input');
            let sum = 0;
            let count = 0;

            inputs.forEach(input => {
                let val = parseFloat(input.value);
                if (!isNaN(val)) {
                    sum += val;
                    count++;
                }
            });

            if (count === 0) {
                alert("مادابيك تكتب نقطة واحدة على الأقل باه نحسبلك! ⚡");
                return;
            }

            let avg = sum / count;
            let resultBox = document.getElementById('resultBox');
            let finalAvgElem = document.getElementById('finalAverage');
            let statusElem = document.getElementById('resultStatus');

            resultBox.style.display = 'block';
            finalAvgElem.innerText = avg.toFixed(2);

            if (avg >= 10) {
                finalAvgElem.className = "result-value above-ten";
                statusElem.innerHTML = "🎉 بصحتك!:";
            } else {
                finalAvgElem.className = "result-value below-ten";
                statusElem.innerHTML = "⚠️ ديت تحت العشرة روح راجع للإستدراك:";
            }
        }

        // دالة حذف البيانات المحفوظة والبدء من جديد
        function clearSavedData() {
            if(confirm("هل راك متأكد بلي راك رايح تبدل الإسم والتخصص؟")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
