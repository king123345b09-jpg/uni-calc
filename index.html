<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTHOS AI CORE | نظام ميثوس الذكي</title>
    <!-- استيراد خط كابشن ملوكي وعصري يناسب الواجهات الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080C14;
            --panel-bg: #111726;
            --neon-blue: #00F0FF;
            --neon-purple: #9D4EDD;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --chat-user: #1E293B;
            --chat-mythos: #1A233A;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        /* 🚪 شاشة التسجيل والترحيب الذكية */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .auth-card {
            background: var(--panel-bg);
            border: 2px solid #1E293B;
            padding: 35px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: fadeIn 0.6s ease-out;
        }

        .auth-logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .auth-input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #090D16;
            color: #FFF;
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .auth-input:focus {
            border-color: var(--neon-blue);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 12px;
            color: #080C14;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* 📱 الواجهة الحساسة الرئيسية (Main Core UI) */
        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 92vh;
            background: var(--panel-bg);
            border: 1px solid #1E293B;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            visibility: hidden; /* تظهر بعد التسجيل */
        }

        /* الهيدر العصري المطور */
        header {
            padding: 15px 20px;
            border-bottom: 1px solid #1E293B;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0D121F;
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand span {
            font-size: 0.8rem;
            background: rgba(157, 78, 221, 0.2);
            color: var(--neon-purple);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .user-tag {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: #1E293B;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
        }

        /* شاشة الشات الذكية وعرض البيانات */
        .chat-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-image: radial-gradient(rgba(0, 240, 255, 0.015) 1px, transparent 0);
            background-size: 30px 30px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .msg-wrapper.user-msg { align-self: flex-start; }
        .msg-wrapper.mythos-msg { align-self: flex-end; }

        .sender-name {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            padding: 0 5px;
        }
        .user-msg .sender-name { color: var(--neon-purple); }
        .mythos-msg .sender-name { color: var(--neon-blue); }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .user-msg .bubble {
            background: var(--chat-user);
            color: #FFF;
            border-top-left-radius: 4px;
        }

        .mythos-msg .bubble {
            background: var(--chat-mythos);
            color: #E2E8F0;
            border-top-right-radius: 4px;
            border: 1px solid #1E293B;
        }

        /* 🎨 ستايل توليد الصور الفخم */
        .generated-img {
            width: 100%;
            max-width: 320px;
            border-radius: 12px;
            margin-top: 10px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            animation: imgGlow 1.5s infinite alternate;
        }

        /* منطقة التحكم والإدخال الحساسة (Fluid Responsive) */
        .input-bar {
            padding: 15px;
            background: #0D121F;
            border-top: 1px solid #1E293B;
            display: flex;
            gap: 10px;
        }

        .type-box {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #334155;
            background: var(--bg-deep);
            color: #FFF;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s;
        }

        .type-box:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .action-btn {
            padding: 0 22px;
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 100%);
            border: none;
            color: #080C14;
            font-weight: 800;
            font-size: 0.95rem;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.02);
        }

        /* مؤشر التحميل والتفكير */
        .thinking-dots {
            display: flex; gap: 4px; padding: 5px;
        }
        .thinking-dots span {
            width: 6px; height: 6px; background: var(--neon-blue); border-radius: 50%;
            animation: dotJump 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotJump {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes imgGlow { from { box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); } to { box-shadow: 0 0 20px rgba(157, 78, 221, 0.4); } }

        /* تعديلات لتوافق شاشات الهواتف بالكامل 📱 */
        @media (max-width: 600px) {
            body { padding: 5px; }
            .app-container { height: 98vh; border-radius: 16px; }
            .msg-wrapper { max-width: 88%; }
            .bubble { font-size: 0.9rem; padding: 10px 12px; }
            .action-btn { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <!-- 🚪 شاشة التحقق وجمع البيانات الأولى للـ User -->
    <div class="auth-overlay" id="authScreen">
        <div class="auth-card">
            <div class="auth-logo">MYTHOS CORE</div>
            <p>أهلاً بك في نظام ميثوس الخارق. لتخصيص الذكاء الاصطناعي بالكامل، يرجى كتابة اسمك:</p>
            <input type="text" id="userNameInput" class="auth-input" placeholder="اكتب اسمك هنا..." autocomplete="off">
            <button class="auth-btn" onclick="initializeMythosSystem()">تشغيل نظام ميثوس</button>
        </div>
    </div>

    <!-- 📱 واجهة التطبيق والشات الشاملة المحفوظة -->
    <div class="app-container" id="appScreen">
        <header>
            <div class="brand">
                <h1>MYTHOS_AI <span>v3.0</span></h1>
            </div>
            <div class="user-tag" id="userTagDisplay">المستخدم: ..</div>
        </header>

        <!-- ساحة عرض الرسائل والمحاضرة -->
        <div class="chat-view" id="chatView"></div>

        <!-- بار الكتابة والتحكم -->
        <div class="input-bar">
            <input type="text" id="mainInput" class="type-box" placeholder="اسأل ميثوس عن أي شيء، أو اطلب صورة (مثال: اصنع صورة سيارة)..." onkeypress="handleCheckKey(event)">
            <button class="action-btn" onclick="processUserCommand()">إرسال</button>
        </div>
    </div>

    <script>
        let currentUsername = "";
        let memoryKey = "MYTHOS_CHAT_HISTORY";

        // تشغيل السيستم والتحقق من الذاكرة اللحظية عند فتح الموقع
        document.addEventListener("DOMContentLoaded", () => {
            let savedName = localStorage.getItem("MYTHOS_USER_NAME");
            if (savedName) {
                currentUsername = savedName;
                launchApp();
            }
        });

        function initializeMythosSystem() {
            let nameInput = document.getElementById("userNameInput").value.trim();
            if (nameInput === "") {
                alert("يرجى إدخال اسمك لتفعيل النواة الذكية!");
                return;
            }
            currentUsername = nameInput;
            localStorage.setItem("MYTHOS_USER_NAME", nameInput);
            launchApp();
        }

        function launchApp() {
            document.getElementById("authScreen").style.opacity = "0";
            document.getElementById("authScreen").style.visibility = "hidden";
            document.getElementById("appScreen").style.visibility = "visible";
            document.getElementById("userTagDisplay").innerText = `المستخدم: ${currentUsername}`;
            
            // تحميل المكالمات والمحادثات القديمة المحفوظة في الذاكرة
            loadSavedConversations();
        }

        // 🧠 خوارزمية ميثوس الشاملة للذكاء الاصطناعي وصناعة الصور والردود الخارقة
        function processUserCommand() {
            const inputElement = document.getElementById("mainInput");
            const rawQuery = inputElement.value.trim();
            if (rawQuery === "") return;

            // 1. عرض هدرة المستخدم في الشات
            appendChatBubble(rawQuery, "user", currentUsername);
            inputElement.value = "";

            // 2. تفعيل تأثير التفكير والتحميل اللحظي
            const chatView = document.getElementById("chatView");
            const loaderDiv = document.createElement("div");
            loaderDiv.className = "msg-wrapper mythos-msg loader-temp";
            loaderDiv.innerHTML = `
                <div class="sender-name">ميثوس_AI</div>
                <div class="bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div>
            `;
            chatView.appendChild(loaderDiv);
            chatView.scrollTop = chatView.scrollHeight;

            // 3. معالجة الرد الذكي وحفظ الجلسة
            setTimeout(() => {
                loaderDiv.remove();
                let replyData = coreThinkingEngine(rawQuery);
                appendChatBubble(replyData.text, "mythos", "ميثوس_AI", replyData.imgUrl);
                
                // حفظ المكالمة فوراً في الذاكرة لتطابق الميزة المطلوبة
                saveCurrentChatToMemory();
            }, 900);
        }

        function coreThinkingEngine(query) {
            let text = query.toLowerCase();
            let result = { text: "", imgUrl: null };

            // 🎨 ميزة صناعة الصور المطلوبة
            if (text.includes("صورة") || text.includes("صنع صورة") || text.includes("صمم") || text.includes("image")) {
                result.text = `🎯 تم تفعيل محرك الصور المدمج! لقد قمت بتوليد هذه الصورة لك بناءً على طلبك العالي الدقة:`;
                // استخدام روابط صور عشوائية ذكية من Unsplash تحاكي الكلمة المطلوبة
                let keywords = text.replace(/صورة|صنع|صمم|ارسم/g, "").trim();
                if(!keywords) keywords = "cyberpunk";
                result.imgUrl = `https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&auto=format&fit=crop`; 
                return result;
            }

            // 💬 الذكاء الشامل (العقلية المرنة والخارقة مثلي)
            if (text.includes("مرحبا") || text.includes("سلام") || text.includes("اهلين")) {
                result.text = `يا أهلاً ويا مرحباً بك يا ${currentUsername}! 🔥 نظام ميثوس الشامل في الخدمة بالكامل. كيف يمكنني إبهارك اليوم؟ يمكننا مناقشة العلوم، حل المسائل، صناعة الصور، أو حتى التخطيط لأفكارك العبقرية!`;
            } else if (text.includes("شكون انت") || text.includes("من انت") || text.includes("ماذا تفعل")) {
                result.text = `أنا ميثوس (MYTHOS AI)، ذكاء اصطناعي خارق ومساعدك الشخصي الدائم. صُممت لأكون شاملاً وعصرياً وسريعاً جداً، أحفظ مكالماتنا، وأصنع الصور، وأحل أعقد الأمور بكل مرونة وشطارة! 😎⚡`;
            } else if (text.includes("احسب") || text.includes("رياضيات") || text.includes("فيزياء")) {
                result.text = `أنت في حضرة العقل المفكر! ضع مسألتك الرياضية أو الفيزيائية هنا، وسيقوم نظام ميثوس بتفكيكها خطوة بخطوة وإعطائك النتيجة الصافية فوراً بحلول ذكية.`;
            } else {
                result.text = `🎯 رسالة رائعة ومفهومة يا ${currentUsername}! بصفتي نظام ميثوس الخارق، تم تحليل طلبك وحفظه في جلسة العمل الحالية. أنا جاهز تماماً لتلبية وتوسيع هذا الموضوع، قولي برك واش حاب نزيدو نطوروا فيه؟ هاتها وريني شطارتك!`;
            }

            return result;
        }

        // دالة بناء وبث الفقاعات داخل الواجهة الحساسة
        function appendChatBubble(text, sender, senderName, imgUrl = null) {
            const chatView = document.getElementById("chatView");
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}-msg`;

            let innerContent = `
                <div class="sender-name">${senderName}</div>
                <div class="bubble">${text}`;
            
            if (imgUrl) {
                innerContent += `<br><img src="${imgUrl}" class="generated-img" alt="Generated by Mythos">`;
            }
            
            innerContent += `</div>`;
            wrapper.innerHTML = innerContent;
            chatView.appendChild(wrapper);
            chatView.scrollTop = chatView.scrollHeight;
        }

        // 💾 محرك الحفظ والذاكرة (تلبية لمطلب "يحفضلك مكالماتك معاه")
        function saveCurrentChatToMemory() {
            const chatView = document.getElementById("chatView");
            localStorage.setItem(memoryKey, chatView.innerHTML);
        }

        function loadSavedConversations() {
            const chatView = document.getElementById("chatView");
            let savedData = localStorage.getItem(memoryKey);
            if (savedData) {
                chatView.innerHTML = savedData;
                chatView.scrollTop = chatView.scrollHeight;
            } else {
                // رسالة ترحيبية أولية افتراضية إذا كانت الذاكرة فارغة
                appendChatBubble(`[تم تفعيل نواة ميثوس الخارقة بنجاح] مرحباً بك يا ${currentUsername}. أنا ميثوس، نظامك الشامل والمحفوظ بالكامل. اسألني عن أي شيء، أو اطلب مني توليد صور حية الآن! 🤖🔥`, "mythos", "ميثوس_AI");
            }
        }

        function handleCheckKey(event) {
            if (event.key === "Enter") {
                processUserCommand();
            }
        }
    </script>
</body>
</html>
